<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="t d">
<title id="t">JakeAI Tattoo workflow</title><desc id="d">A six-step tattoo workflow from story through style, concept directions, artist-ready pack, revision continuity, and creator launch.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050814"/><stop offset=".5" stop-color="#0c1628"/><stop offset="1" stop-color="#190d1c"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#69e7ff"/><stop offset=".5" stop-color="#a98cff"/><stop offset="1" stop-color="#ffad57"/></linearGradient><pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#74e6ff" stroke-opacity=".045"/></pattern></defs>
<rect width="1440" height="500" rx="34" fill="url(#bg)"/><rect width="1440" height="500" rx="34" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="58" y="70" fill="#70e7ff" font-size="20" font-weight="800" letter-spacing="5">JAKEAI TATTOO · AUTONOMOUS CREATIVE WORKFLOW</text><text x="58" y="120" fill="#fff" font-size="43" font-weight="900">From idea to ink-ready.</text><text x="58" y="153" fill="#a9b9cc" font-size="18">AI untangles the brief. Human artists remain the final technical authority.</text></g>
<g transform="translate(52 204)" font-family="Arial,Helvetica,sans-serif">
<g><rect width="194" height="214" rx="20" fill="#0a1322" stroke="#31536e"/><path d="M72 52h50M72 70h40M72 88h28" stroke="#6ce8ff" stroke-width="5" stroke-linecap="round"/><circle cx="137" cy="69" r="24" fill="none" stroke="#ffad57" stroke-width="4"/><path d="M137 93v18" stroke="#ffad57" stroke-width="4"/><text x="30" y="137" fill="#fff" font-size="20" font-weight="800">01 · IDEA / STORY</text><text x="24" y="169" fill="#9fb1c5" font-size="14">Meaning, memory,</text><text x="24" y="190" fill="#9fb1c5" font-size="14">symbol or reference.</text></g>
<text x="201" y="110" fill="#6ce8ff" font-size="38">→</text>
<g transform="translate(221)"><rect width="194" height="214" rx="20" fill="#0a1322" stroke="#31536e"/><path d="M97 34c-28 15-37 35-30 63 4 16 1 30-14 46M97 34c28 15 37 35 30 63-4 16-1 30 14 46" fill="none" stroke="#a98cff" stroke-width="5"/><path d="M75 112h44" stroke="#ffad57" stroke-width="5"/><text x="18" y="137" fill="#fff" font-size="18" font-weight="800">02 · STYLE / PLACE</text><text x="24" y="169" fill="#9fb1c5" font-size="14">Style, scale, body</text><text x="24" y="190" fill="#9fb1c5" font-size="14">placement and mood.</text></g>
<text x="422" y="110" fill="#6ce8ff" font-size="38">→</text>
<g transform="translate(442)"><rect width="194" height="214" rx="20" fill="#0a1322" stroke="#31536e"/><rect x="45" y="45" width="90" height="80" rx="10" fill="none" stroke="#a98cff" stroke-width="4"/><rect x="57" y="36" width="90" height="80" rx="10" fill="none" stroke="#6ce8ff" stroke-width="3" opacity=".7"/><text x="17" y="137" fill="#fff" font-size="18" font-weight="800">03 · DIRECTIONS</text><text x="24" y="169" fill="#9fb1c5" font-size="14">Multiple curated</text><text x="24" y="190" fill="#9fb1c5" font-size="14">concept paths.</text></g>
<text x="643" y="110" fill="#6ce8ff" font-size="38">→</text>
<g transform="translate(663)"><rect width="194" height="214" rx="20" fill="#0a1322" stroke="#31536e"/><rect x="54" y="37" width="86" height="88" rx="8" fill="none" stroke="#6ce8ff" stroke-width="4"/><text x="75" y="72" fill="#fff" font-size="15">PNG</text><text x="75" y="92" fill="#fff" font-size="15">SVG</text><text x="75" y="112" fill="#ffad57" font-size="15">STENCIL</text><text x="18" y="137" fill="#fff" font-size="17" font-weight="800">04 · ARTIST PACK</text><text x="24" y="169" fill="#9fb1c5" font-size="14">Clean files, notes</text><text x="24" y="190" fill="#9fb1c5" font-size="14">and stencil layers.</text></g>
<text x="864" y="110" fill="#6ce8ff" font-size="38">→</text>
<g transform="translate(884)"><rect width="194" height="214" rx="20" fill="#0a1322" stroke="#31536e"/><path d="M60 75h75M60 75l18-18M60 75l18 18M135 75l-18-18M135 75l-18 18" fill="none" stroke="#a98cff" stroke-width="5" stroke-linecap="round"/><text x="15" y="137" fill="#fff" font-size="17" font-weight="800">05 · REVISION LINE</text><text x="24" y="169" fill="#9fb1c5" font-size="14">Refine without</text><text x="24" y="190" fill="#9fb1c5" font-size="14">losing the thread.</text></g>
<text x="1085" y="110" fill="#ffad57" font-size="38">→</text>
<g transform="translate(1105)"><rect width="270" height="214" rx="20" fill="#111421" stroke="#ffad57"/><path d="M78 50h72v58H78z" fill="none" stroke="#ffad57" stroke-width="4"/><path d="M70 50l14-20h60l14 20M114 108v28" fill="none" stroke="#ffad57" stroke-width="4"/><text x="36" y="137" fill="#fff" font-size="19" font-weight="800">06 · CREATOR LAUNCH</text><text x="24" y="169" fill="#d6b594" font-size="14">List, promote, sell.</text><text x="24" y="190" fill="#d6b594" font-size="14">Nothing posts without approval.</text></g>
</g>
<text x="58" y="462" fill="#ffbd72" font-family="Arial" font-size="18" font-weight="800">MEASURE TWICE. TATTOO ONCE. REGRET IS A TERRIBLE FONT.</text>
</svg>