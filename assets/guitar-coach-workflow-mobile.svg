<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1030" role="img" aria-labelledby="t d">
<title id="t">JakeAI Guitar Coach mobile workflow</title><desc id="d">Seven vertical steps from setting a goal to playing the song.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a12"/><stop offset=".55" stop-color="#071a27"/><stop offset="1" stop-color="#160d0a"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#68e7ff"/><stop offset=".65" stop-color="#39bfff"/><stop offset="1" stop-color="#ff9f43"/></linearGradient>
</defs>
<rect width="420" height="1030" rx="26" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="24" y="42" fill="#72e8ff" font-size="12" font-weight="800" letter-spacing="2.4">JAKEAI · AUTONOMOUS PRACTICE LOOP</text>
<text x="24" y="78" fill="#fff" font-size="28" font-weight="900">A simple loop.</text>
<text x="24" y="108" fill="#fff" font-size="28" font-weight="900">Real progress.</text>
<text x="24" y="137" fill="#9fb8c7" font-size="13">Listen. Correct. Repeat. Remember. Play.</text>
</g>
<path d="M55 190V875" stroke="url(#g)" stroke-width="4" opacity=".7"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(24 165)"><circle cx="31" cy="31" r="30" fill="#0c2130" stroke="#68e7ff" stroke-width="2"/><text x="22" y="38" fill="#68e7ff" font-size="22" font-weight="900">1</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Set a goal</text><text x="82" y="49" fill="#a9bbc8" font-size="13">Pick a song, skill, or milestone.</text></g>
<g transform="translate(24 275)"><circle cx="31" cy="31" r="30" fill="#0c2130" stroke="#68e7ff" stroke-width="2"/><text x="22" y="38" fill="#68e7ff" font-size="22" font-weight="900">2</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Listen</text><text x="82" y="49" fill="#a9bbc8" font-size="13">JakeAI hears what you play.</text></g>
<g transform="translate(24 385)"><circle cx="31" cy="31" r="30" fill="#0c2130" stroke="#68e7ff" stroke-width="2"/><text x="22" y="38" fill="#68e7ff" font-size="22" font-weight="900">3</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Diagnose</text><text x="82" y="49" fill="#a9bbc8" font-size="13">Find what’s right and what to fix.</text></g>
<g transform="translate(24 495)"><circle cx="31" cy="31" r="30" fill="#2b1c10" stroke="#ffad57" stroke-width="2"/><text x="22" y="38" fill="#ffad57" font-size="22" font-weight="900">4</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Micro-correct</text><text x="82" y="49" fill="#d6b594" font-size="13">One focused fix. Try again.</text></g>
<g transform="translate(24 605)"><circle cx="31" cy="31" r="30" fill="#0c2130" stroke="#68e7ff" stroke-width="2"/><text x="22" y="38" fill="#68e7ff" font-size="22" font-weight="900">5</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Repeat</text><text x="82" y="49" fill="#a9bbc8" font-size="13">Practice until the step is earned.</text></g>
<g transform="translate(24 715)"><circle cx="31" cy="31" r="30" fill="#0c2130" stroke="#68e7ff" stroke-width="2"/><text x="22" y="38" fill="#68e7ff" font-size="22" font-weight="900">6</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Remember</text><text x="82" y="49" fill="#a9bbc8" font-size="13">Your next session starts smarter.</text></g>
<g transform="translate(24 825)"><circle cx="31" cy="31" r="30" fill="#2b1c10" stroke="#ffad57" stroke-width="2"/><text x="22" y="38" fill="#ffad57" font-size="22" font-weight="900">7</text><text x="82" y="25" fill="#fff" font-size="20" font-weight="900">Play the song</text><text x="82" y="49" fill="#d6b594" font-size="13">Turn practice into real music.</text></g>
<text x="24" y="974" fill="#ffb66d" font-size="14" font-weight="800">SMALL STEPS. BIG RIFFS.</text>
<text x="24" y="996" fill="#78e9ff" font-size="12">Same guitar. Smarter you.</text>
</g></svg>