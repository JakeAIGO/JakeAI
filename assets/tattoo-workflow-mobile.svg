<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-labelledby="t d">
<title id="t">JakeAI Tattoo mobile workflow</title><desc id="d">Six vertical steps from idea to creator launch.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050814"/><stop offset=".55" stop-color="#0d1730"/><stop offset="1" stop-color="#190d20"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#64e7ff"/><stop offset=".5" stop-color="#a78cff"/><stop offset="1" stop-color="#ffb052"/></linearGradient></defs>
<rect width="420" height="920" rx="26" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="24" y="42" fill="#70e7ff" font-size="12" font-weight="800" letter-spacing="2.2">JAKEAI TATTOO · CREATIVE WORKFLOW</text><text x="24" y="79" fill="#fff" font-size="28" font-weight="900">From idea to ink-ready.</text><text x="24" y="107" fill="#a9b9cc" font-size="13">AI untangles the brief. Humans tattoo humans.</text></g>
<path d="M55 166V770" stroke="url(#g)" stroke-width="4" opacity=".7"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(24 140)"><circle cx="31" cy="31" r="30" fill="#0c2030" stroke="#68e7ff" stroke-width="2"/><text x="21" y="38" fill="#68e7ff" font-size="22" font-weight="900">1</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Idea / story</text><text x="82" y="49" fill="#a8b9ca" font-size="13">Meaning, memory, symbol, reference.</text></g>
<g transform="translate(24 245)"><circle cx="31" cy="31" r="30" fill="#18152a" stroke="#aa8cff" stroke-width="2"/><text x="21" y="38" fill="#aa8cff" font-size="22" font-weight="900">2</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Style + placement</text><text x="82" y="49" fill="#b6aecd" font-size="13">Style, scale, body placement, mood.</text></g>
<g transform="translate(24 350)"><circle cx="31" cy="31" r="30" fill="#18152a" stroke="#aa8cff" stroke-width="2"/><text x="21" y="38" fill="#aa8cff" font-size="22" font-weight="900">3</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Concept directions</text><text x="82" y="49" fill="#b6aecd" font-size="13">Several curated paths, not one guess.</text></g>
<g transform="translate(24 455)"><circle cx="31" cy="31" r="30" fill="#0c2030" stroke="#68e7ff" stroke-width="2"/><text x="21" y="38" fill="#68e7ff" font-size="22" font-weight="900">4</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Artist-ready pack</text><text x="82" y="49" fill="#a8b9ca" font-size="13">Clean files, notes, stencil layers.</text></g>
<g transform="translate(24 560)"><circle cx="31" cy="31" r="30" fill="#18152a" stroke="#aa8cff" stroke-width="2"/><text x="21" y="38" fill="#aa8cff" font-size="22" font-weight="900">5</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Revision continuity</text><text x="82" y="49" fill="#b6aecd" font-size="13">Refine without losing the thread.</text></g>
<g transform="translate(24 665)"><circle cx="31" cy="31" r="30" fill="#2b1c10" stroke="#ffad57" stroke-width="2"/><text x="21" y="38" fill="#ffad57" font-size="22" font-weight="900">6</text><text x="82" y="25" fill="#fff" font-size="19" font-weight="900">Creator launch</text><text x="82" y="49" fill="#d6b594" font-size="13">List, promote, sell — after approval.</text></g>
<text x="24" y="842" fill="#ffbd72" font-size="14" font-weight="800">MEASURE TWICE. TATTOO ONCE.</text><text x="24" y="866" fill="#8eeaff" font-size="12">Regret is a terrible font.</text>
</g></svg>