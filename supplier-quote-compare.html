<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>JakeAI Supplier Quote Compare</title><style>body{font-family:system-ui;max-width:980px;margin:32px auto;padding:0 16px;background:#08101b;color:#eef}.card{background:#111c2b;padding:20px;border-radius:12px;margin:16px 0}input,button{padding:12px;margin:6px 0}button{background:#00d8e8;border:0;border-radius:8px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334;text-align:left}.bad{color:#ffb454}.ok{color:#63e6a6}small{color:#9ab}</style></head><body><h1>Supplier Quote Compare</h1><p>Drop supplier CSV quotes in. Normalize SKU, unit size and price; compare offers; flag ambiguity instead of guessing.</p><div class=card><b>Required CSV columns:</b> sku, description, price, pack_qty, supplier<br><input id=f type=file multiple accept=".csv"><br><button onclick=go()>Compare Quotes</button><p><small>Decision support only. No purchasing or supplier communication is executed.</small></p></div><div id=o></div><script>function parse(s){let a=s.trim().split(/\r?\n/).map(x=>x.split(','));let h=a.shift().map(x=>x.trim().toLowerCase());return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }async function go(){let fs=[...f.files],rows=[];for(let x of fs)rows.push(...parse(await x.text()));let req=['sku','description','price','pack_qty','supplier'],bad=[];rows.forEach((r,i)=>req.forEach(k=>{if(!r[k])bad.push(`Row ${i+2}: missing ${k}`)}));let groups={};rows.forEach(r=>{let sku=(r.sku||'').replace(/[^a-z0-9]/gi,'').toUpperCase(),p=+r.price,q=+r.pack_qty;if(!sku||!(p>=0)||!(q>0))return;(groups[sku]??=[]).push({...r,unit:p/q})});let out=`<div class=card><h2>Exceptions</h2>${bad.length?bad.map(x=>`<div class=bad>${x}</div>`).join(''):'<div class=ok>No required-field exceptions.</div>'}</div>`;out+=`<div class=card><h2>Comparison</h2><table><tr><th>SKU</th><th>Supplier</th><th>Pack</th><th>Price</th><th>Unit price</th><th>Status</th></tr>`;Object.entries(groups).sort().forEach(([sku,a])=>{let m=Math.min(...a.map(x=>x.unit));a.sort((x,y)=>x.unit-y.unit).forEach(x=>out+=`<tr><td>${sku}</td><td>${x.supplier}</td><td>${x.pack_qty}</td><td>${(+x.price).toFixed(2)}</td><td>${x.unit.toFixed(4)}</td><td class=${x.unit==m?'ok':''}>${x.unit==m?'LOWEST NORMALIZED':'—'}</td></tr>`)});o.innerHTML=out+'</table></div>'}</script></body></html>
