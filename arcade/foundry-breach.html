<title>JakeAI Foundry Breach — Game #007</title>
<style>
:root{--cyan:#67ebff;--mag:#ff4fd8;--amber:#ffd166;--green:#72ffb7;--ink:#eefaff;--bg:#020407}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#wrap{
  position:fixed;left:0;top:0;width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(103,235,255,.035) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(rgba(103,235,255,.025) 1px,transparent 1px) 0 0/34px 34px,
    radial-gradient(circle at 50% 35%,#0a1720 0,#020407 65%);
}
#wrap:before,#wrap:after{
  content:"JAKEAI // FOUNDRY LINK";position:absolute;top:50%;transform:translateY(-50%) rotate(-90deg);
  color:rgba(103,235,255,.22);font:900 11px/1 ui-monospace,monospace;letter-spacing:.28em;pointer-events:none
}
#wrap:before{left:12px}#wrap:after{right:12px;transform:translateY(-50%) rotate(90deg)}
#stage{
  position:relative;width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));
  aspect-ratio:16/9;background:#020407;overflow:hidden;box-shadow:0 0 80px #000,0 0 0 1px rgba(103,235,255,.12)
}
canvas{display:block;width:100%;height:100%;touch-action:none}

.ctrl{position:absolute;pointer-events:auto;touch-action:none;user-select:none;border:1px solid rgba(103,235,255,.32);background:rgba(3,10,15,.70);color:white;box-shadow:0 0 16px rgba(103,235,255,.08);backdrop-filter:blur(4px);font:900 clamp(12px,1.7vw,18px)/1 ui-monospace,monospace}
.ctrl:active{background:rgba(103,235,255,.22)}
#joyBase{position:absolute;left:16px;bottom:14px;width:108px;height:108px;border-radius:50%;
  pointer-events:auto;touch-action:none;border:1px solid rgba(103,235,255,.38);
  background:radial-gradient(circle at 50% 50%,rgba(103,235,255,.08),rgba(3,10,15,.76) 68%);
  box-shadow:inset 0 0 24px rgba(103,235,255,.07),0 0 18px rgba(0,0,0,.35)}
#joyBase:before,#joyBase:after{content:"";position:absolute;background:rgba(103,235,255,.16);pointer-events:none}
#joyBase:before{left:50%;top:12px;bottom:12px;width:1px}
#joyBase:after{top:50%;left:12px;right:12px;height:1px}
#joyKnob{position:absolute;left:31px;top:31px;width:46px;height:46px;border-radius:50%;pointer-events:none;
  border:1px solid rgba(103,235,255,.7);background:rgba(9,27,35,.94);
  box-shadow:0 0 18px rgba(103,235,255,.16)}
#joyHint{position:absolute;left:132px;bottom:51px;width:92px;color:#74919d;font:800 9px/1.35 ui-monospace,monospace;
  letter-spacing:.04em;text-align:left;pointer-events:none}
#jump,#use{bottom:14px;width:76px;height:54px;border-radius:12px}
#jump{right:14px;border-color:rgba(103,235,255,.58)}
#use{right:98px;border-color:rgba(255,79,216,.45)}
#auxToggle{left:50%;transform:translateX(-50%);bottom:14px;width:62px;height:34px;border-radius:9px;font-size:10px;color:#a8ddeb}
#auxTray{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:54px;width:226px;height:42px;
  border:1px solid rgba(103,235,255,.20);border-radius:10px;background:rgba(2,7,11,.88);
  box-shadow:0 0 26px rgba(0,0,0,.45);pointer-events:auto}
#auxTray.open{display:block}
#auxTray .mini{position:static;width:68px;height:30px;margin:5px 2px;border-radius:7px;font-size:9px}
#rotate{display:none;right:182px;bottom:14px;width:68px;height:34px;border-radius:8px;font-size:9px;color:#fff0b8}
#full{font-size:15px;color:#dffaff}
#puzzleClose{display:none;left:50%;transform:translateX(-50%);bottom:14px;width:68px;height:34px;border-radius:8px;font-size:9px}
#gamepadBadge{display:none;position:absolute;left:50%;transform:translateX(-50%);top:8px;color:#72ffb7;
  font:900 9px/1 ui-monospace,monospace;letter-spacing:.08em;pointer-events:none}
#orientationGate{display:none;position:fixed;inset:0;z-index:9999;background:
radial-gradient(circle at 50% 40%,rgba(13,45,56,.96),rgba(0,0,0,.99) 65%);
align-items:center;justify-content:center;padding:28px;text-align:center}
#orientationGate .gateCard{max-width:560px;border:1px solid rgba(103,235,255,.55);
background:rgba(3,10,15,.92);box-shadow:0 0 60px rgba(103,235,255,.12);padding:28px 24px;border-radius:18px}
#orientationGate .gateEyebrow{font:900 12px/1 ui-monospace,monospace;letter-spacing:.18em;color:#67ebff;margin-bottom:14px}
#orientationGate .gateTitle{font:900 clamp(28px,9vw,54px)/.95 system-ui,sans-serif;letter-spacing:-.04em;margin:0 0 14px}
#orientationGate .phoneIcon{font-size:58px;display:inline-block;transform:rotate(90deg);margin:6px 0 14px;filter:drop-shadow(0 0 12px rgba(103,235,255,.28))}
#orientationGate .gateText{font:700 14px/1.45 ui-monospace,monospace;color:#a9c0ca}
@media (pointer:coarse),(max-width:900px){#mobile{display:block}}
@media (orientation:portrait) and (pointer:coarse){
  #orientationGate{display:flex}
  #mobile{display:none!important}
}

<body><div id="wrap"><div id="stage"><canvas id="game" width="1280" height="720"></canvas>
<div id="mobile">
<div id="joyBase" aria-label="Virtual joystick"><div id="joyKnob"></div></div>

<script>
(()=>{'use strict';
const C=document.getElementById('game'),X=C.getContext('2d',{alpha:false});
const W=1280,H=720,PLAY=520,HUD=200; const DPR=Math.min(devicePixelRatio||1,2);
let mode='title',running=false,paused=false,last=0,clock=30*60,room=0,deaths=0,snoozes=2,liftInits=1,frags=[];
let elevatorRide=null,elevatorCooldown=0;
let toast='',toastT=0,searching=null,searchProgress=0,robotSleep=0,screenFlash=0,roomFade=0;
const keys=Object.create(null), pointer={left:false,right:false,jump:false,use:false};
const joy={active:false,id:null,x:0,y:0,upLatched:false,downLatched:false};
const padPrev={};
let gamepadConnected=false;
let wasInElevatorCabin=false;
let audio=null;
let pausedForPortrait=false;

function isCoarseMobile(){
  return window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
}
function portraitNow(){
  return isCoarseMobile() && window.innerHeight > window.innerWidth;
}
function fitVisibleViewport(){
  const vv=window.visualViewport;
  const vw=Math.max(1,Math.round(vv?vv.width:window.innerWidth));
  const vh=Math.max(1,Math.round(vv?vv.height:window.innerHeight));
  const wrap=document.getElementById('wrap');
  const stage=document.getElementById('stage');

  // Size against what the player can actually see, not legacy mobile 100vh
  // (which can include the browser's address/navigation bars).
  wrap.style.width=vw+'px';
  wrap.style.height=vh+'px';

  let sw=vw, sh=sw*9/16;
  if(sh>vh){ sh=vh; sw=sh*16/9; }
  stage.style.width=Math.floor(sw)+'px';
  stage.style.height=Math.floor(sh)+'px';
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',fitVisibleViewport);
  visualViewport.addEventListener('scroll',fitVisibleViewport);
}
window.addEventListener('resize',fitVisibleViewport);
window.addEventListener('orientationchange',()=>setTimeout(fitVisibleViewport,100));
setTimeout(fitVisibleViewport,0);

async function requestArcadeView(){
  try{
    const root=document.documentElement;
    if(root.requestFullscreen && !document.fullscreenElement) await root.requestFullscreen({navigationUI:'hide'});
  }catch(e){}
  try{
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  }catch(e){}
  setTimeout(fitVisibleViewport,120);
}
function syncOrientationPause(){
  if(portraitNow()){
    if(mode==='play' && !paused){ paused=true; pausedForPortrait=true; }
  }else if(pausedForPortrait){
    paused=false; pausedForPortrait=false;
  }
}
window.addEventListener('resize',syncOrientationPause);
window.addEventListener('orientationchange',()=>setTimeout(syncOrientationPause,120));


function setGamepadBadge(on){
  gamepadConnected=on;
  const b=document.getElementById('gamepadBadge');
  if(b)b.style.display=on?'block':'none';
}
window.addEventListener('gamepadconnected',()=>setGamepadBadge(true));
window.addEventListener('gamepaddisconnected',()=>{
  const any=[...(navigator.getGamepads?.()||[])].some(Boolean);setGamepadBadge(any);
});

function padPressed(gp,i){
  const now=!!gp?.buttons?.[i]?.pressed, before=!!padPrev[i];
  padPrev[i]=now;
  return now&&!before;
}
function pollGamepad(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  const gp=[...gps].find(Boolean);
  if(!gp){if(gamepadConnected)setGamepadBadge(false);return}
  if(!gamepadConnected)setGamepadBadge(true);

  const ax=Math.abs(gp.axes?.[0]||0)>.22?(gp.axes[0]||0):0;
  const ay=Math.abs(gp.axes?.[1]||0)>.30?(gp.axes[1]||0):0;
  const dl=!!gp.buttons?.[14]?.pressed, dr=!!gp.buttons?.[15]?.pressed;
  const du=!!gp.buttons?.[12]?.pressed, dd=!!gp.buttons?.[13]?.pressed;

  pointer.left=ax<-.22||dl;
  pointer.right=ax>.22||dr;

  if(mode==='puzzle'){
    if(padPressed(gp,14))sel=(sel+5)%6;
    if(padPressed(gp,15)||padPressed(gp,0))sel=(sel+1)%6;
    if(padPressed(gp,2)||padPressed(gp,12))rotateSelected();
    if(padPressed(gp,1)||padPressed(gp,3))togglePuzzle();
    return;
  }

  const elevatorReady=mode==='play'&&ROOM_META[room].elevator&&inElevatorCabin()&&!elevatorRide;
  const upNow=ay<-.55||du, downNow=ay>.55||dd;
  if(elevatorReady){
    if(upNow&&!padPrev.gpUp)rideElevator(-1);
    if(downNow&&!padPrev.gpDown)rideElevator(1);
  }else if(upNow&&!padPrev.gpUp){jump()}
  padPrev.gpUp=upNow; padPrev.gpDown=downNow;

  pointer.use=!!gp.buttons?.[2]?.pressed;
  if(padPressed(gp,0))jump();          // A
  if(padPressed(gp,4))useSnooze();     // LB
  if(padPressed(gp,3))togglePuzzle();  // Y
  if(padPressed(gp,9))paused=!paused;  // Start
}

function setupVirtualJoystick(){
  const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');
  if(!base||!knob)return;
  const center=()=>{knob.style.transform='translate(0px,0px)';joy.x=joy.y=0;pointer.left=pointer.right=false};
  const move=e=>{
    if(!joy.active||e.pointerId!==joy.id)return;
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31,mag=Math.hypot(dx,dy);
    if(mag>max){dx=dx/mag*max;dy=dy/mag*max}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    joy.x=dx/max;joy.y=dy/max;
    pointer.left=joy.x<-.22;pointer.right=joy.x>.22;

    if(mode==='puzzle'){
      if(joy.x<-.68&&!joy.upLatched){sel=(sel+5)%6;joy.upLatched=true}
      else if(joy.x>.68&&!joy.downLatched){sel=(sel+1)%6;joy.downLatched=true}
      if(Math.abs(joy.x)<.35){joy.upLatched=joy.downLatched=false}
      return;
    }

    const elevatorReady=mode==='play'&&ROOM_META[room].elevator&&inElevatorCabin()&&!elevatorRide;
    if(joy.y<-.68&&!joy.upLatched){
      elevatorReady?rideElevator(-1):jump();
      joy.upLatched=true;
    }else if(joy.y>-.35){joy.upLatched=false}
    if(joy.y>.68&&!joy.downLatched){
      if(elevatorReady)rideElevator(1);
      joy.downLatched=true;
    }else if(joy.y<.35){joy.downLatched=false}
  };
  const down=e=>{e.preventDefault();joy.active=true;joy.id=e.pointerId;base.setPointerCapture?.(e.pointerId);move(e)};
  const end=e=>{if(e.pointerId!==joy.id)return;e.preventDefault();joy.active=false;joy.id=null;joy.upLatched=joy.downLatched=false;center()};
  base.addEventListener('pointerdown',down);base.addEventListener('pointermove',move);
  base.addEventListener('pointerup',end);base.addEventListener('pointercancel',end);
}
function tone(f=440,d=.08,v=.035,type='square'){try{audio ||= new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function say(s){toast=s;toastT=2.7}
function speakIntro(){
  const line='Stay a while. Stay forever.';
  say(line.toUpperCase());
  toastT=3.6;
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(line);
      u.lang='en-US';u.rate=.72;u.pitch=.55;u.volume=.95;
      const voices=window.speechSynthesis.getVoices();
      const preferred=voices.find(v=>/english|en-US/i.test((v.lang||'')+' '+(v.name||'')))||voices[0];
      if(preferred)u.voice=preferred;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
  tone(92,.22,.035,'sawtooth');
  setTimeout(()=>tone(138,.18,.028,'square'),170);
}
const FLOOR_NAMES=['SURFACE // INGEST','DISCOVERY LEVEL','PRODUCTION LEVEL','CONTROL LEVEL','RESTRICTED CORE'];
const NAMES=[
 'INGEST BAY','ELEVATOR A','AGENT GATEWAY',
 'DISCOVERY LAB','ELEVATOR B','TRUST ENGINE',
 'ARCADE RELAY','ELEVATOR C','WORKFLOW FOUNDRY',
 'EVIDENCE LEDGER','ELEVATOR D','MODEL ROUTER',
 'QUARANTINE VAULT','ELEVATOR E','CORE CHAMBER'
];
const ROOM_META=NAMES.map((name,i)=>({name,floor:Math.floor(i/3),wing:i%3===0?'LEFT':i%3===1?'SHAFT':'RIGHT',elevator:i%3===1,core:i===14}));
const FLOOR_ACCENTS=['#67ebff','#ff7cae','#72ffb7','#ffd166','#ff4fd8'];
const PAL=NAMES.map((_,i)=>{
 const f=Math.floor(i/3),a=FLOOR_ACCENTS[f];
 const bases=[
  ['#172733','#d7ded8','#77d65d','#203947'],
  ['#261823','#e2ddd4','#d25182','#3a2030'],
  ['#15271f','#d5ded8','#63c979','#294532'],
  ['#282119','#ded9cf','#d7b34e','#3b3422'],
  ['#24151e','#dfd6dd','#b34b9f','#40233a']
 ][f];
 return [...bases,a];
});
const ITEM_BY_ROOM={
 0:['frag',0],2:['snooze'],3:['frag',1],5:['frag',2],6:['lift'],8:['frag',3],
 9:['frag',4],11:['snooze'],12:['frag',5]
};
function roomTemplate(i){
 const y0=486,meta=ROOM_META[i],f=meta.floor;
 if(meta.elevator){
   return {
    platforms:[[0,y0,1280,34],[250,390,225,18],[805,390,225,18]],
    objects:[],
    bots:f>1?[{x:1040,y:y0-30,min:870,max:1180,type:f%3,dir:-1,speed:62+f*3,phase:f}]:[],
    lift:null,elevator:true
   };
 }
 const variants=[
  [[0,y0,1280,34],[82,354,268,20],[443,240,282,20],[846,365,320,20]],
  [[0,y0,1280,34],[112,270,245,20],[460,390,278,20],[824,238,305,20]],
  [[0,y0,1280,34],[64,375,288,20],[420,224,252,20],[750,355,205,20],[1010,238,188,20]],
  [[0,y0,1280,34],[100,238,255,20],[455,345,320,20],[900,220,240,20]]
 ];
 const layouts=variants[(i+f)%variants.length].map(a=>a.slice());
 const objs=[
   {x:layouts[1][0]+54,y:layouts[1][1]-48,type:'desk'},
   {x:layouts[2][0]+90,y:layouts[2][1]-58,type:i%2?'server':'console'},
   {x:layouts[3]?(layouts[3][0]+88):1030,y:layouts[3]?(layouts[3][1]-54):y0-54,type:i%3===0?'cabinet':'terminal'}
 ];
 objs.forEach((o,k)=>{
   o.id=i+'-'+k;o.searched=false;
   o.item=k===1?(ITEM_BY_ROOM[i]||['junk']):(k===0&&i===5?['lift']:['junk']);
 });
 const bots=[{x:620,y:y0-30,min:380,max:900,type:i%3,dir:i%2?1:-1,speed:58+f*5,phase:i*.5}];
 if(f>=2)bots.push({x:1050,y:y0-30,min:880,max:1190,type:(i+1)%3,dir:-1,speed:68+f*4,phase:2+i});
 let lift=null;
 if(!meta.core){const lx=i%2?350:750;lift={x:lx,y:430,w:88,h:16,minY:185,maxY:430,dir:-1,speed:58,enabled:true};}
 return {platforms:layouts,objects:objs,bots,lift,elevator:false};
}
const ROOMS=Array.from({length:15},(_,i)=>roomTemplate(i));
const player={x:44,y:420,w:34,h:62,vx:0,vy:0,on:false,facing:1,inv:0,state:'idle',anim:0,onLift:false,searchPose:0};
const spawn={x:48,y:PLAY-34-62};

function currentFloor(){return ROOM_META[room].floor}
function shaftRoom(f){return f*3+1}
function inElevatorCabin(){return ROOM_META[room].elevator && player.x>500 && player.x<746 && player.y>315}
function updateMobileControls(){
 const elev=ROOM_META[room].elevator && mode==='play' && !elevatorRide && inElevatorCabin();
 const puzzleMode=mode==='puzzle';
 const jm=document.getElementById('joyMode');
 if(jm){
   if(elev){
     const f=currentFloor();
     jm.textContent=f===0?'PULL DOWN = FLOOR 2':f===4?'PUSH UP = FLOOR 4':'UP/DOWN = FLOOR';
   }else jm.textContent='UP = JUMP';
 }
 document.getElementById('use').style.display=puzzleMode?'none':'block';
 document.getElementById('jump').style.display=puzzleMode?'none':'block';
 document.getElementById('auxToggle').style.display=puzzleMode?'none':'block';
 document.getElementById('rotate').style.display=puzzleMode?'block':'none';
 document.getElementById('puzzleClose').style.display=puzzleMode?'block':'none';
 if(puzzleMode) document.getElementById('auxTray').classList.remove('open');
}
function resetPlayer(side=1,center=false){
 player.x=center?623:(side>0?48:W-82);player.y=spawn.y;player.vx=player.vy=0;player.inv=1.05;searchProgress=0;searching=null;
 updateMobileControls();
}
function enterRoom(n,side=1,center=false){
 room=n;resetPlayer(side,center);roomFade=.42;
 say(ROOM_META[room].elevator?('ELEVATOR // '+FLOOR_NAMES[currentFloor()]):('ENTERING '+NAMES[room]));
 tone(260,.05);setTimeout(()=>tone(390,.07),55);
}
function nextRoom(dir){
 const meta=ROOM_META[room],col=room%3;
 let n=room+dir;
 if(dir<0 && col===0){player.x=0;return}
 if(dir>0 && col===2){player.x=W-player.w;return}
 if(n<0||n>=ROOMS.length||ROOM_META[n].floor!==meta.floor){player.x=dir<0?0:W-player.w;return}
 enterRoom(n,dir);
}
function rideElevator(delta){
 if(mode!=='play'||elevatorRide||!ROOM_META[room].elevator||!inElevatorCabin()||elevatorCooldown>0){
   if(ROOM_META[room].elevator&&!inElevatorCabin())say('STEP INTO THE ELEVATOR CAR');
   return;
 }
 const from=currentFloor(),to=from+delta;
 if(to<0||to>4){say(delta<0?'TOP FLOOR':'LOWEST LEVEL');tone(150,.06,.02);return}
 elevatorRide={from,to,t:0,duration:1.55};
 player.vx=player.vy=0;searching=null;
 say((delta>0?'DESCENDING':'ASCENDING')+' // '+FLOOR_NAMES[to]);
 tone(118,.2,.025,'sawtooth');setTimeout(()=>tone(92,.24,.02,'square'),180);
}
function platTopCollision(dt){player.on=false;player.onLift=false;const ps=[...ROOMS[room].platforms.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3]}))];const l=ROOMS[room].lift;if(l)ps.push(l);

function drawPuzzle(t){X.fillStyle='rgba(0,0,0,.84)';X.fillRect(0,42,W,PLAY-42);X.fillStyle='#0a1116';X.fillRect(120,86,1040,380);X.strokeStyle='#67ebff';X.lineWidth=2;X.strokeRect(120,86,1040,380);X.fillStyle='#eefaff';X.font='900 24px ui-monospace';X.fillText('WORKFLOW GENOME ASSEMBLY',155,126);X.fillStyle='#7f9aa7';X.font='700 12px ui-monospace';X.fillText('SELECT: ←/→    ROTATE: R / TAP ROTATE    CLOSE: P    Align every recovered shard with its reference notch.',155,151);
 for(let i=0;i<6;i++){const x=220+i*155,y=280;X.fillStyle=i===sel?'rgba(103,235,255,.12)':'rgba(255,255,255,.025)';X.fillRect(x-64,y-82,128,164);X.strokeStyle=i===sel?'#67ebff':'#263841';X.lineWidth=i===sel?2:1;X.strokeRect(x-64,y-82,128,164);const have=frags.includes(i);if(have){X.globalAlpha=.15;shardShape(i,targetRot[i],x,y,.9,false);X.globalAlpha=1;shardShape(i,rot[i],x,y,.72,false)}else{X.fillStyle='#35464f';X.font='800 12px ui-monospace';X.textAlign='center';X.fillText('MISSING',x,y+4);X.textAlign='left'}X.fillStyle=have&&rot[i]===targetRot[i]?'#72ffb7':'#7e929b';X.font='800 11px ui-monospace';X.textAlign='center';X.fillText(have&&rot[i]===targetRot[i]?'LOCKED':'ROT '+rot[i],x,y+104);X.textAlign='left'}
 const done=puzzleComplete();X.fillStyle=done?'#72ffb7':'#75909c';X.font='900 16px ui-monospace';X.textAlign='center';X.fillText(done?'GENOME VALIDATED // CORE ACCESS AUTHORIZED':frags.length<6?`RECOVER ${6-frags.length} MORE SHARD${6-frags.length===1?'':'S'}`:'ALIGN ALL SIX SHARDS',W/2,440);X.textAlign='left';
}
function drawTitle(t){bgRoom(t);drawPlatforms();X.fillStyle='rgba(0,0,0,.72)';X.fillRect(0,0,W,H);const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(12,38,48,.22)');g.addColorStop(1,'rgba(0,0,0,.9)');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#67ebff';X.font='900 14px ui-monospace';X.fillText('JAKEAI ARCADE // GAME #007 // RELEASE 1.0',108,136);X.fillStyle='#f4fbff';X.font='900 74px system-ui,sans-serif';X.fillText('FOUNDRY',104,214);X.fillText('BREACH',104,281);X.fillStyle='#9ab3bf';X.font='600 18px system-ui,sans-serif';X.fillText('Five floors. Fifteen rooms. One central elevator shaft.',108,327);X.fillText('Search the wings. Ride the shaft. Rebuild the Genome. Reach the Core.',108,354);X.fillStyle='rgba(103,235,255,.08)';X.strokeStyle='#67ebff';X.lineWidth=1;rr(108,392,260,54,10);X.strokeRect(108,392,260,54);X.fillStyle='#eafcff';X.font='900 16px ui-monospace';X.fillText('CLICK / TAP TO BREACH',132,425);X.fillStyle='#67ebff';X.font='700 12px ui-monospace';X.fillText('AUDIO ON',132,447);X.fillStyle='#ff4fd8';X.font='900 16px ui-monospace';X.fillText('“STAY A WHILE. STAY FOREVER.”',108,483);
X.fillStyle='#7f9aa7';X.font='700 12px ui-monospace';X.fillText('Security has been notified. Security is also an AI.',108,509);X.fillStyle='#607985';X.font='700 11px ui-monospace';X.fillText('ORIGINAL JAKEAI UNIVERSE GAME // INSPIRED BY 1980s INFILTRATION PUZZLE PLATFORMERS',108,662)}

function draw(t){
 if(elevatorRide){drawElevatorRide(t);drawTopbar();drawHUD(t);}
 else {bgRoom(t);drawPlatforms();for(const o of ROOMS[room].objects)drawObject(o,t);for(const b of ROOMS[room].bots)drawRobot(b,t);drawPlayer(t);drawSearch(t);drawTopbar();drawHUD(t);}

 if(mode==='puzzle')drawPuzzle(t);if(toastT>0&&mode!=='title'){X.fillStyle='rgba(3,7,10,.91)';const tw=Math.min(820,Math.max(330,X.measureText(toast).width+48));X.fillRect(W/2-tw/2,55,tw,38);X.strokeStyle=PAL[room][4];X.strokeRect(W/2-tw/2,55,tw,38);X.fillStyle='#eefaff';X.font='800 13px ui-monospace';X.textAlign='center';X.fillText(toast,W/2,80);X.textAlign='left'}
 if(screenFlash>0){X.fillStyle=`rgba(255,50,70,${screenFlash*.35})`;X.fillRect(0,0,W,PLAY)}if(roomFade>0){X.fillStyle=`rgba(0,0,0,${roomFade})`;X.fillRect(0,0,W,PLAY)}if(mode==='title')drawTitle(t);if(mode==='win')drawEnd(true);if(mode==='lose')drawEnd(false);if(paused&&mode==='play'){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.font='900 50px ui-monospace';X.textAlign='center';X.fillText('PAUSED',W/2,H/2);X.textAlign='left'}}
function coreCheck(){if(room===14&&puzzleComplete()&&player.x>500&&player.x<820&&player.y<330){mode='win';tone(520,.12,.04);setTimeout(()=>tone(780,.18,.04),120)}}
function loop(ts){const t=ts/1000,dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);coreCheck();draw(t);requestAnimationFrame(loop)}
function start(){if(mode==='title'||mode==='win'||mode==='lose'){
  if(mode!=='title'){location.reload();return}
  requestArcadeView();
  mode='play';running=true;speakIntro();
  setTimeout(()=>{if(mode==='play')say('BREACH ACTIVE // FIND SIX GENOME SHARDS')},3100);
  setTimeout(()=>{syncOrientationPause();updateMobileControls();},80);
}}
C.addEventListener('pointerdown',e=>{if(mode==='title'||mode==='win'||mode==='lose'){start();return}if(mode==='puzzle'){const r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,x=(e.clientX-r.left)*sx,y=(e.clientY-r.top)*sy;if(y>195&&y<375){sel=Math.max(0,Math.min(5,Math.floor((x-156)/155)));rotateSelected()}return}});
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(mode==='title'){start();return}if(mode==='puzzle'){if(e.code==='ArrowLeft')sel=(sel+5)%6;if(e.code==='ArrowRight'||e.code==='Space')sel=(sel+1)%6;if(e.code==='KeyR'||e.code==='ArrowUp')rotateSelected();if(e.code==='KeyP'||e.code==='Escape')togglePuzzle();return}if(e.code==='Space')jump();
if(e.code==='ArrowUp'||e.code==='KeyW'){if(ROOM_META[room].elevator&&inElevatorCabin())rideElevator(-1);else jump()}
if(e.code==='ArrowDown'||e.code==='KeyS'){if(ROOM_META[room].elevator&&inElevatorCabin())rideElevator(1)}
if(e.code==='KeyQ')useSnooze();if(e.code==='KeyR')initLift();if(e.code==='KeyP')togglePuzzle();if(e.code==='Escape')paused=!paused});
addEventListener('keyup',e=>keys[e.code]=false);
function bind(id,name,oneShot){const el=document.getElementById(id);if(!el)return;const down=e=>{e.preventDefault();if(oneShot){oneShot();return}pointer[name]=true;if(name==='jump')jump()};const up=e=>{e.preventDefault();if(name)pointer[name]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
bind('jump','jump');bind('use','use');bind('snooze',null,useSnooze);bind('puzzle',null,togglePuzzle);bind('rotate',null,rotateSelected);bind('puzzleClose',null,togglePuzzle);
document.getElementById('auxToggle')?.addEventListener('pointerdown',e=>{e.preventDefault();document.getElementById('auxTray').classList.toggle('open')});
document.getElementById('full')?.addEventListener('pointerdown',e=>{e.preventDefault();requestArcadeView();document.getElementById('auxTray').classList.remove('open')});

C.addEventListener('pointerdown',e=>{
  if(!isCoarseMobile()||mode!=='play'||elevatorRide||!ROOM_META[room].elevator||!inElevatorCabin())return;
  const r=C.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);
  // Tap the elevator-car arrow area: left half = up, right half = down.
  if(y>315 && y<430 && x>535 && x<745){
    e.preventDefault();
    if(x<640) rideElevator(-1); else rideElevator(1);
  }
});

setupVirtualJoystick();updateMobileControls();
if(new URLSearchParams(location.search).has('autostart'))setTimeout(start,100);
requestAnimationFrame(loop);
})();
