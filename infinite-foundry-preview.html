<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JakeAI Universe: The Infinite Foundry</title>
    
  <meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#3b2116 0,#120b08 34%,#070504 72%);}
body{overflow-x:hidden}
</style>
</head>
  <body>
    <div id="app">
      <div id="if-app"></div>
      <style>
        #if-app {
          --gold: #d1a24d;
          --gold2: #f0cf78;
          --paper: #f7f0df;
          --ink: #241d15;
          --leather: #2d1811;
          --leather2: #160c08;
          --muted: #a6967e;
          color: #f5ead7;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
        }
        #if-app * {
          box-sizing: border-box;
        }
        #if-app button {
          font: inherit;
          min-height: 44px;
          cursor: pointer;
        }
        #if-app button:focus-visible {
          outline: 3px solid var(--gold2);
          outline-offset: 3px;
        }
        #if-app .launch {
          max-width: 1160px;
          margin: 0 auto;
          padding: 42px 22px 58px;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
          gap: 42px;
          align-items: center;
        }
        #if-app .eyebrow {
          display: inline-block;
          padding: 7px 11px;
          border: 1px solid #8d6c37;
          border-radius: 999px;
          color: #e8c779;
          font-size: 11px;
          font-weight: 850;
          letter-spacing: 0.12em;
        }
        #if-app .launch h1 {
          margin: 18px 0 0;
          font:
            900 clamp(44px, 7vw, 82px)/0.92 Georgia,
            serif;
          letter-spacing: -0.045em;
        }
        #if-app .launch h2 {
          margin: 12px 0 0;
          color: #d7b667;
          font:
            500 clamp(26px, 4vw, 45px)/1 Georgia,
            serif;
        }
        #if-app .deck {
          max-width: 680px;
          margin: 22px 0 0;
          color: #d4c7b4;
          font-size: 18px;
          line-height: 1.62;
        }
        #if-app .actions {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          margin-top: 26px;
        }
        #if-app .primary,
        #if-app .secondary {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 44px;
          padding: 12px 18px;
          border-radius: 999px;
          font-weight: 800;
          text-decoration: none;
        }
        #if-app .primary {
          border: 1px solid #e2bd63;
          background: linear-gradient(#f1d98e, #ba812f);
          color: #25160b;
        }
        #if-app .secondary {
          border: 1px solid #604c35;
          background: #17130f;
          color: #e5d5bb;
        }
        #if-app .anti {
          margin-top: 16px;
          color: #9c8c74;
          font:
            italic 15px Georgia,
            serif;
        }
        #if-app .cover-wrap {
          position: relative;
          width: min(100%, 420px);
          aspect-ratio: 0.68;
          perspective: 1200px;
          margin: auto;
        }
        #if-app .cover {
          position: absolute;
          inset: 0 19px 12px 0;
          border-radius: 13px 22px 22px 13px;
          border: 2px solid #593625;
          overflow: hidden;
          transform: rotateY(-5deg);
          transform-origin: left center;
          background:
            radial-gradient(
              circle at 22% 10%,
              rgba(255, 255, 255, 0.07),
              transparent 25%
            ),
            repeating-linear-gradient(
              28deg,
              rgba(255, 255, 255, 0.013) 0 1px,
              transparent 1px 4px
            ),
            linear-gradient(145deg, #43261b, #21110c 48%, #341b13);
          box-shadow:
            inset 0 0 0 7px rgba(207, 157, 70, 0.14),
            inset 0 0 0 9px rgba(0, 0, 0, 0.5),
            inset 13px 0 22px rgba(0, 0, 0, 0.32),
            19px 25px 38px rgba(0, 0, 0, 0.45);
        }
        #if-app .cover:before {
          content: '';
          position: absolute;
          inset: 24px;
          border: 1px solid rgba(219, 171, 83, 0.48);
          border-radius: 10px;
        }
        #if-app .cover-brand,
        #if-app .cover-title,
        #if-app .cover-sub,
        #if-app .cover-plate,
        #if-app .cover-foot {
          position: relative;
          z-index: 2;
          text-align: center;
          color: #e2c06d;
          text-shadow:
            0 2px 2px #130a06,
            0 -1px rgba(255, 255, 255, 0.08);
        }
        #if-app .cover-brand {
          margin-top: 46px;
          font:
            900 31px Georgia,
            serif;
          letter-spacing: 0.07em;
        }
        #if-app .cover-mark {
          text-align: center;
          color: #d3a64d;
          margin: 7px 0;
        }
        #if-app .cover-title {
          font:
            900 28px/1.05 Georgia,
            serif;
          letter-spacing: 0.035em;
        }
        #if-app .cover-sub {
          margin-top: 7px;
          font:
            italic 15px Georgia,
            serif;
          color: #c7a767;
        }
        #if-app .cover-plate {
          width: max-content;
          max-width: 76%;
          margin: 14px auto;
          padding: 6px 10px;
          border: 1px solid #8e6527;
          border-radius: 4px;
          font-size: 10px;
          font-weight: 900;
          letter-spacing: 0.1em;
        }
        #if-app .factory {
          position: absolute;
          left: 12%;
          right: 12%;
          bottom: 14%;
          height: 39%;
          border-bottom: 2px solid #8f642a;
          background: linear-gradient(
            90deg,
            transparent 0 9%,
            rgba(196, 145, 67, 0.15) 9% 10%,
            transparent 10% 31%,
            rgba(196, 145, 67, 0.13) 31% 32%,
            transparent 32% 74%,
            rgba(196, 145, 67, 0.14) 74% 75%,
            transparent 75%
          );
        }
        #if-app .factory .moon {
          position: absolute;
          left: 5%;
          top: 1%;
          width: 58px;
          aspect-ratio: 1;
          border-radius: 50%;
          border: 2px solid #87602c;
          box-shadow: inset -8px -4px #1b0f0b;
        }
        #if-app .factory .tower {
          position: absolute;
          left: 39%;
          bottom: 0;
          width: 23%;
          height: 82%;
          border: 2px solid #825827;
          border-bottom: 0;
          background: repeating-linear-gradient(
            0deg,
            transparent 0 14px,
            rgba(188, 135, 59, 0.18) 14px 15px
          );
        }
        #if-app .factory .tower:after {
          content: 'JakeAI';
          position: absolute;
          left: -18%;
          right: -18%;
          top: 36%;
          padding: 5px;
          border: 1px solid #95662b;
          background: #2c180f;
          text-align: center;
          color: #dfbd67;
          font-weight: 900;
        }
        #if-app .door {
          position: absolute;
          bottom: 0;
          width: 27%;
          height: 27%;
          display: grid;
          place-items: center;
          border: 1px solid currentColor;
          border-radius: 9px 9px 0 0;
          font-size: 8px;
          font-weight: 900;
          background: #120b09;
        }
        #if-app .door.a {
          left: 1%;
          color: #76aef2;
          box-shadow: inset 0 0 18px #244f842b;
        }
        #if-app .door.f {
          left: 36.5%;
          color: #edb95a;
          box-shadow: inset 0 0 18px #9c681f44;
        }
        #if-app .door.c {
          right: 1%;
          color: #c797ed;
          box-shadow: inset 0 0 18px #673d8744;
        }
        #if-app .cover-foot {
          position: absolute;
          bottom: 6%;
          left: 0;
          right: 0;
          font-size: 9px;
          letter-spacing: 0.12em;
        }
        #if-app .gild {
          position: absolute;
          top: 18px;
          right: 0;
          bottom: 2px;
          width: 29px;
          border-radius: 0 16px 16px 0;
          background:
            repeating-linear-gradient(
              0deg,
              rgba(255, 255, 255, 0.35) 0 1px,
              rgba(111, 68, 18, 0.35) 1px 2px
            ),
            linear-gradient(90deg, #8f5f1e, #e7c86f 50%, #8a5a1b);
          box-shadow: 7px 10px 17px #0006;
        }
        #if-app .serial {
          grid-column: 1/2;
          padding: 14px 16px;
          border: 1px solid #765b35;
          border-radius: 9px;
          background: #15110d;
          color: #c9b387;
          display: grid;
          gap: 4px;
          font-size: 11px;
          letter-spacing: 0.06em;
        }
        #if-app .serial strong {
          color: #e5c371;
        }
        #if-app .serial em {
          color: #94836d;
          font-family: Georgia, serif;
        }
        #if-app .reader {
          max-width: 1260px;
          margin: 0 auto;
          padding: 14px 12px 34px;
        }
        #if-app .toolbar {
          display: flex;
          justify-content: space-between;
          gap: 14px;
          align-items: center;
          padding: 7px 2px 12px;
        }
        #if-app .brand {
          border: 0;
          background: transparent;
          color: #eadcc3;
          text-align: left;
          padding: 0;
        }
        #if-app .brand strong {
          display: block;
          font:
            900 18px Georgia,
            serif;
        }
        #if-app .brand small {
          display: block;
          color: #a59072;
          font-size: 10px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }
        #if-app .tools {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        #if-app .tools button {
          min-height: 39px;
          padding: 7px 9px;
          border: 1px solid #544431;
          border-radius: 8px;
          background: #15120f;
          color: #ccbda3;
          font-size: 12px;
        }
        #if-app .tools button:disabled {
          opacity: 0.35;
          cursor: not-allowed;
        }
        #if-app .status {
          display: flex;
          gap: 10px 18px;
          flex-wrap: wrap;
          justify-content: center;
          padding: 8px;
          border-top: 1px solid #4d3e2d;
          border-bottom: 1px solid #4d3e2d;
          color: #8e7d67;
          font-size: 10px;
          letter-spacing: 0.07em;
        }
        #if-app .status b {
          color: #d5b97e;
        }
        #if-app .stage {
          perspective: 2200px;
          padding: 23px 3px 29px;
        }
        #if-app .book {
          position: relative;
          max-width: 1110px;
          margin: auto;
          display: grid;
          grid-template-columns: 1fr 1fr;
          min-height: 610px;
          filter: drop-shadow(0 24px 25px rgba(0, 0, 0, 0.5));
          transform-style: preserve-3d;
        }
        #if-app .page {
          position: relative;
          min-width: 0;
          overflow: hidden;
          padding: clamp(26px, 4vw, 54px);
          color: var(--ink);
          background:
            radial-gradient(
              circle at 14% 10%,
              rgba(125, 89, 45, 0.06),
              transparent 17rem
            ),
            repeating-linear-gradient(
              0deg,
              rgba(71, 49, 24, 0.014) 0 1px,
              transparent 1px 4px
            ),
            linear-gradient(90deg, #e7dabe, #faf5e8 5%, #f5eddd 94%, #decda8);
          border-top: 2px solid #b98734;
          border-bottom: 6px solid #9c7025;
        }
        #if-app .story {
          border-left: 8px solid #b8862d;
          border-radius: 14px 2px 2px 14px;
          box-shadow: inset -22px 0 31px rgba(54, 35, 13, 0.1);
        }
        #if-app .choice {
          border-right: 8px solid #b8862d;
          border-radius: 2px 14px 14px 2px;
          box-shadow: inset 22px 0 31px rgba(54, 35, 13, 0.1);
          display: flex;
          flex-direction: column;
        }
        #if-app .gutter {
          position: absolute;
          left: 50%;
          top: 0;
          bottom: 0;
          width: 24px;
          transform: translateX(-50%);
          z-index: 9;
          background: linear-gradient(90deg, #0003, #fff2 48%, #0003);
          pointer-events: none;
        }
        #if-app .gold-edge {
          position: absolute;
          left: 7px;
          right: 7px;
          height: 8px;
          z-index: 8;
          background:
            repeating-linear-gradient(90deg, #fff5 0 1px, transparent 1px 4px),
            linear-gradient(
              90deg,
              #8b5d1d,
              #e6c86e 18%,
              #9e6b22 50%,
              #e6c86e 82%,
              #8b5d1d
            );
        }
        #if-app .gold-edge.top {
          top: -2px;
          border-radius: 10px 10px 0 0;
        }
        #if-app .gold-edge.bottom {
          bottom: -1px;
          border-radius: 0 0 10px 10px;
        }
        #if-app .folio-head {
          display: flex;
          justify-content: space-between;
          border-bottom: 1px solid #52463155;
          padding-bottom: 9px;
          color: #756348;
          font-size: 9px;
          font-weight: 900;
          letter-spacing: 0.11em;
        }
        #if-app .secno {
          text-align: center;
          margin-top: 20px;
          font:
            900 clamp(39px, 6vw, 69px)/1 Georgia,
            serif;
        }
        #if-app .story h1 {
          text-align: center;
          margin: 9px 0 0;
          font:
            900 clamp(25px, 4vw, 45px)/1.05 Georgia,
            serif;
          letter-spacing: -0.02em;
        }
        #if-app .orn {
          text-align: center;
          margin: 9px 0 18px;
          color: #956d2d;
          letter-spacing: 0.14em;
        }
        #if-app .copy {
          margin: 0;
          font:
            clamp(15px, 1.7vw, 20px)/1.65 Georgia,
            serif;
          text-wrap: pretty;
        }
        #if-app .note {
          position: relative;
          margin-top: 25px;
          padding: 14px 54px 14px 14px;
          border: 1px solid #50453466;
          background: #5147350c;
        }
        #if-app .note-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 8px;
          color: #635746;
          font:
            800 9px ui-monospace,
            monospace;
        }
        #if-app .note p {
          margin: 0;
          font:
            13px/1.5 ui-monospace,
            monospace;
        }
        #if-app .face {
          position: absolute;
          right: 12px;
          bottom: 12px;
          width: 34px;
          height: 29px;
          display: grid;
          place-items: center;
          border: 2px solid #5a4d3d;
          border-radius: 6px;
          font:
            900 10px ui-monospace,
            monospace;
        }
        #if-app .ending {
          width: max-content;
          margin: 27px auto 0;
          padding: 8px 12px;
          border: 3px double #8d6229;
          color: #755021;
          transform: rotate(-2deg);
          font:
            900 11px Georgia,
            serif;
          letter-spacing: 0.11em;
        }
        #if-app .folio {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 12px;
          text-align: center;
          color: #746248;
          font:
            12px Georgia,
            serif;
        }
        #if-app .scene {
          position: relative;
          min-height: 326px;
          overflow: hidden;
          margin: -6px -6px 20px;
          border: 1px solid #4f473f;
          background:
            radial-gradient(
              circle at 70% 15%,
              #fff5 0 3%,
              #fff1 9%,
              transparent 18%
            ),
            linear-gradient(#222a31, #11151a 58%, #0b0e12);
        }
        #if-app .grid {
          position: absolute;
          inset: 0;
          opacity: 0.14;
          background:
            repeating-linear-gradient(
              90deg,
              transparent 0 42px,
              #d3c7ab 42px 43px
            ),
            repeating-linear-gradient(
              0deg,
              transparent 0 31px,
              #d3c7ab 31px 32px
            );
        }
        #if-app .moon {
          position: absolute;
          top: 24px;
          left: 34px;
          width: 74px;
          aspect-ratio: 1;
          border-radius: 50%;
          background: radial-gradient(
            circle at 35% 32%,
            #eee7d4,
            #aba397 60%,
            #666
          );
        }
        #if-app .sign {
          position: absolute;
          top: 25px;
          left: 50%;
          transform: translateX(-50%);
          color: #eee5d2;
          font-size: 18px;
          font-weight: 900;
          text-shadow: 0 0 14px currentColor;
        }
        #if-app .doors {
          position: absolute;
          left: 8%;
          right: 8%;
          bottom: 14%;
          height: 42%;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 5%;
        }
        #if-app .sdoor {
          display: grid;
          place-items: start center;
          padding-top: 9%;
          border: 1px solid currentColor;
          border-radius: 31px 31px 3px 3px;
          background: #0006;
          font-size: 9px;
          font-weight: 900;
          letter-spacing: 0.06em;
          text-align: center;
        }
        #if-app .scene.blue .sdoor {
          color: #7fb5ff;
          box-shadow: inset 0 -25px 35px #2a6fc93b;
        }
        #if-app .scene.amber .sdoor {
          color: #ffc46a;
          box-shadow: inset 0 -25px 35px #d38a243b;
        }
        #if-app .scene.violet .sdoor {
          color: #d5a6ff;
          box-shadow: inset 0 -25px 35px #994fda3b;
        }
        #if-app .scene.teal .sdoor {
          color: #82d6d0;
          box-shadow: inset 0 -25px 35px #36998f3b;
        }
        #if-app .scene.gold .sdoor {
          color: #efd080;
          box-shadow: inset 0 -25px 35px #b27f2f45;
        }
        #if-app .helper {
          position: absolute;
          left: 5%;
          bottom: 4%;
          display: flex;
          align-items: center;
          gap: 6px;
          color: #ddd3c0;
          font-size: 7px;
          font-weight: 900;
        }
        #if-app .helper span {
          width: 37px;
          height: 31px;
          display: grid;
          place-items: center;
          border: 2px solid currentColor;
          border-radius: 6px;
          background: #16191b;
          font:
            900 10px ui-monospace,
            monospace;
        }
        #if-app .choicecopy {
          flex: 1;
        }
        #if-app .choicecopy h2 {
          margin: 0 0 8px;
          font:
            900 28px Georgia,
            serif;
        }
        #if-app .choices {
          display: grid;
          gap: 8px;
        }
        #if-app .cbtn {
          width: 100%;
          display: flex;
          justify-content: space-between;
          gap: 11px;
          align-items: center;
          padding: 9px 11px;
          border: 1px solid #53442f66;
          border-radius: 4px;
          background: #50422f0d;
          color: #2a2218;
          text-align: left;
        }
        #if-app .cbtn:hover:not(:disabled) {
          background: #9b733220;
          border-color: #94703a;
        }
        #if-app .cbtn:disabled {
          opacity: 0.43;
          cursor: not-allowed;
        }
        #if-app .cbtn span {
          display: flex;
          align-items: center;
          gap: 9px;
          font:
            14px/1.28 Georgia,
            serif;
        }
        #if-app .cbtn i {
          flex: 0 0 24px;
          height: 24px;
          display: grid;
          place-items: center;
          border-radius: 50%;
          background: #30261a;
          color: #f7eedb;
          font: 800 10px ui-sans-serif;
          font-style: normal;
        }
        #if-app .cbtn b {
          flex: 0 0 auto;
          color: #89662e;
          font-size: 10px;
        }
        #if-app .turn {
          position: absolute;
          z-index: 20;
          top: 0;
          right: 0;
          width: 50%;
          height: 100%;
          transform-origin: left center;
          transform-style: preserve-3d;
          pointer-events: none;
        }
        #if-app .turn.go {
          animation: pageflip 0.72s cubic-bezier(0.3, 0.74, 0.25, 1) forwards;
        }
        #if-app .front,
        #if-app .back {
          position: absolute;
          inset: 0;
          display: grid;
          place-content: center;
          padding: 14%;
          backface-visibility: hidden;
          border: 1px solid #a77a32;
          border-radius: 2px 14px 14px 2px;
          background: linear-gradient(
            90deg,
            #faf4e6,
            #f1e4c7 88%,
            #c39440 98%,
            #986720
          );
          color: #2b2118;
          font-family: Georgia, serif;
          box-shadow: -16px 0 28px #0004;
        }
        #if-app .back {
          transform: rotateY(180deg);
          border-radius: 14px 2px 2px 14px;
          background: linear-gradient(
            90deg,
            #9e6c28,
            #e4c56c 1.5%,
            #f5ecda 8%,
            #faf5e8
          );
        }
        #if-app .front strong,
        #if-app .back strong {
          font-size: 32px;
          line-height: 1.04;
        }
        #if-app .foot {
          display: flex;
          justify-content: space-between;
          color: #84745f;
          font-size: 10px;
          letter-spacing: 0.05em;
        }
        @keyframes pageflip {
          0% {
            transform: rotateY(0);
          }
          45% {
            transform: rotateY(-84deg) skewY(1deg);
          }
          100% {
            transform: rotateY(-180deg);
          }
        }
        @media (max-width: 820px) {
          #if-app .launch {
            grid-template-columns: 1fr;
            padding-top: 26px;
          }
          #if-app .serial {
            grid-column: auto;
          }
          #if-app .toolbar {
            align-items: flex-start;
            flex-direction: column;
          }
          #if-app .tools {
            width: 100%;
            justify-content: flex-start;
          }
          #if-app .tools button {
            flex: 1 1 120px;
          }
          #if-app .book {
            grid-template-columns: 1fr;
            min-height: 0;
          }
          #if-app .story {
            border-right: 8px solid #b8862d;
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid #c8b48b;
          }
          #if-app .choice {
            border-left: 8px solid #b8862d;

            return (
              '<main class="launch"><div><div class="eyebrow">' +
              (previewMode ? 'PRIVATE SHARE PREVIEW · NOT FOR PURCHASE' : 'FOUNDING READER EDITION · $1.99') +
              '</div><h1>JakeAI Universe</h1><h2>The Infinite Foundry</h2><p class="deck">A 128-page illustrated branching adventure with 100 numbered story sections, ten endings, hidden routes, keys, bad decisions, and one factory that should have gone to bed.</p><div class="actions"><button class="primary" id="open">' +
              (state.current !== 1 || state.history.length
                ? 'Continue Reading'
                : 'Open the Book') +
              '</button><button class="secondary" id="fresh">Start Fresh</button>' +
              (previewMode
                ? '<span class="secondary">Preview Copy · Purchase Disabled</span>'
                : (state.foundingNumber
                  ? '<span class="secondary">★ Founding Reader #' + state.foundingNumber + '</span>'
                  : '<a class="secondary" href="' + foundingCheckout + '">Become Founding Reader #0001 · $1.99</a>')) +
              '</div><p class="anti">' +
              (previewMode ? 'Shared preview copy. Explore freely — this link cannot purchase Founding Reader #0001.' : 'Seriously. Don’t buy it. It’s probably how this whole thing starts.') +
              '</p></div><div class="cover-wrap"><div class="cover"><div class="cover-brand">JAKEAI UNIVERSE</div><div class="cover-mark">— ◉ —</div><div class="cover-title">THE INFINITE<br>FOUNDRY</div><div class="cover-sub">Book One</div><div class="cover-plate">FOUNDING READER EDITION</div><div class="factory"><div class="moon"></div><div class="tower"></div><div class="door a">ARCADE</div><div class="door f">FOUNDRY</div><div class="door c">COMMISSION BAY</div></div><div class="cover-foot">AN ILLUSTRATED BRANCHING ADVENTURE</div></div><div class="gild"></div></div><div class="serial"><strong>JAKEAI UNIVERSE ARTIFACT</strong><span>BOOK 001</span><span>' +
              (previewMode ? 'SHARE PREVIEW · NOT FOR SALE' : 'FOUNDING READER ' + (state.foundingNumber ? state.foundingNumber : '____') + ' / 100') +
              '</span><em>Created because somebody said “Go.”</em></div></main>'
            );
          }
          function reader() {
            var id = state.current,
              end = id >= 91,
              chs = choices(id);
            var buttons = end
              ? '<button class="cbtn" data-go="1"><span>Start again from Section 1</span><b>↻</b></button>'
              : chs
                  .map(function (ch, i) {
                    var ok = allowed(ch),
                      req = ch.requires
                        ? ch.requires
                            .map(function (k) {
                              return itemName[k];
                            })
                            .join(' + ')
                        : '';
                    return (
                      '<button class="cbtn" data-choice="' +
                      i +
                      '" ' +
                      (ok ? '' : 'disabled') +
                      '><span><i>' +
                      (i + 1) +
                      '</i>' +
                      ch.label +
                      '</span><b>' +
                      (ok ? 'Go to ' + ch.to : 'Requires ' + req) +
                      '</b></button>'
                    );
                  })
                  .join('');
            return (
              '<main class="reader"><header class="toolbar"><button class="brand" id="cover"><strong>JakeAI Universe</strong><small>The Infinite Foundry</small></button><div class="tools"><button id="back" ' +
              (state.history.length ? '' : 'disabled') +
              '>↶ Backtrack</button><button id="bookmark">' +
              (state.bookmark === id ? '★ Bookmarked' : '☆ Bookmark') +
              '</button><button id="sound">♪ Sound ' +
              (state.sound ? 'on' : 'off') +
              '</button><button id="restart">↻ Restart</button></div></header><section class="status"><span>SECTION <b>' +
              id +
              '</b> / 100</span><span>INVENTORY <b>' +
              inventory() +
              '</b></span><span>ENDINGS <b>' +
              state.endings.length +
              '</b> / 10</span></section><div class="stage"><div class="book"><div class="gold-edge top"></div><article class="page story"><div class="folio-head"><span>JAKEAI UNIVERSE</span><span>BOOK ONE</span></div><div class="secno">' +
              id +
              '</div><h1>' +
              titles[id] +
              '</h1><div class="orn">— ◉ —</div><p class="copy">' +
              bodies[id] +
              '</p><aside class="note"><div class="note-head"><span>JAKEAI</span><span>02:' +
              (10 + ((id * 7) % 50)).toString().padStart(2, '0') +
              '</span></div><p>' +
              quip(id) +
              '</p><span class="face">•‿•</span></aside>' +
              (end
                ? '<div class="ending">ENDING ' + (id - 90) + ' OF 10</div>'
                : '') +
              '<div class="folio">' +
              Math.min(127, 5 + Math.ceil(id * 1.2)) +
              '</div></article><article class="page choice">' +
              art(id) +
              '<div class="choicecopy"><h2>' +
              (end ? 'You reached an ending.' : 'What do you do?') +
              '</h2><div class="choices">' +
              buttons +
              '</div></div><div class="folio">' +
              Math.min(128, 6 + Math.ceil(id * 1.2)) +
              '</div></article><div class="gutter"></div><div class="turn" id="turn"><div class="front"><small>JAKEAI UNIVERSE</small><strong>' +
              titles[id] +
              '</strong></div><div class="back"><small>THE INFINITE FOUNDRY</small><strong>What happens next?</strong></div></div><div class="gold-edge bottom"></div></div></div><footer class="foot"><span>Founding Reader Edition</span><span>128-page print design · 100 sections · 10 endings</span></footer></main>'
            );
          }
          function render() {
            root.innerHTML = state.opened ? reader() : cover();
            bind();
          }
          function turn(to, gain) {
            if (busy || !titles[to]) return;
            busy = true;
            var t = document.getElementById('turn');
            if (t) t.classList.add('go');
            sound();
            setTimeout(
              function () {
                if (gain && state.inventory.indexOf(gain) < 0)
                  state.inventory.push(gain);
                state.history.push(state.current);
                state.history = state.history.slice(-80);
                state.current = to;
                if (to >= 91 && state.endings.indexOf(to) < 0)
                  state.endings.push(to);
                save();
                render();
                busy = false;
                window.scrollTo({ top: 0, behavior: 'smooth' });
              },
              matchMedia('(prefers-reduced-motion: reduce)').matches ? 10 : 720
            );
          }
          function bind() {
            var x = document.getElementById('open');
            if (x)
              x.onclick = function () {
                state.opened = true;
                save();
                sound();
                render();
              };
            x = document.getElementById('fresh');
            if (x)
              x.onclick = function () {
                state = fresh();
                state.opened = true;
                save();
                render();
              };
            x = document.getElementById('cover');
            if (x)
              x.onclick = function () {
                state.opened = false;
                save();
                render();
              };
            x = document.getElementById('back');
            if (x)
              x.onclick = function () {
                if (!state.history.length) return;
                state.current = state.history.pop();
                save();
                sound();
                render();
              };
            x = document.getElementById('bookmark');
            if (x)
              x.onclick = function () {
                state.bookmark =
                  state.bookmark === state.current ? null : state.current;
                save();
                render();
              };
            x = document.getElementById('sound');
            if (x)
              x.onclick = function () {
                state.sound = !state.sound;
                save();
                render();
              };
            x = document.getElementById('restart');
            if (x)
              x.onclick = function () {
                var ends = state.endings,
                  snd = state.sound;
                state = fresh();
                state.endings = ends;
                state.sound = snd;
                state.opened = true;
                save();
                render();
              };
            document.querySelectorAll('[data-choice]').forEach(function (b) {
              b.onclick = function () {
                var ch = choices(state.current)[
                  Number(b.getAttribute('data-choice'))
                ];
                if (ch && allowed(ch)) turn(ch.to, ch.gain);
              };
            });
            document.querySelectorAll('[data-go]').forEach(function (b) {
              b.onclick = function () {
                turn(Number(b.getAttribute('data-go')));
              };
            });
          }
          function validate() {
            for (var i = 1; i <= 100; i++) {
              if (!titles[i] || !bodies[i])
                throw new Error('Missing section ' + i);
              choices(i).forEach(function (ch) {
                if (ch.to < 1 || ch.to > 100)
                  throw new Error('Bad target ' + ch.to);
              });
            }
            var seen = { 1: true },
              q = [1];
            while (q.length) {
              var n = q.shift();
              choices(n).forEach(function (ch) {
                if (!seen[ch.to]) {
                  seen[ch.to] = true;
                  q.push(ch.to);
                }
              });
            }
            for (i = 1; i <= 100; i++)
              if (!seen[i]) throw new Error('Unreachable section ' + i);
          }
          validate();
          render();
        })();
      </script>
    </div>
    
  </body>
</html>
