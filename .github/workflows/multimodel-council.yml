name: JakeAI Multi-Model Council
on:
  workflow_dispatch:
    inputs:
      package_path:
        description: Repository path to frozen review package
        required: true
        default: product-discovery/council-packages/customer-evidence-intake-v1-review.md
      live_calls:
        description: Explicitly authorize paid/external model API calls
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline council tests
        working-directory: product-discovery
        run: python -m unittest -v test_multimodel_council.py
      - name: Run council
        env:
          COUNCIL_LIVE_CALLS: ${{ inputs.live_calls && '1' || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_COUNCIL_MODEL: ${{ vars.OPENAI_COUNCIL_MODEL || 'gpt-5.6-sol' }}
          ANTHROPIC_COUNCIL_MODEL: ${{ vars.ANTHROPIC_COUNCIL_MODEL || 'claude-sonnet-5' }}
          GEMINI_COUNCIL_MODEL: ${{ vars.GEMINI_COUNCIL_MODEL || 'gemini-3.8-flash' }}
          PERPLEXITY_COUNCIL_MODEL: ${{ vars.PERPLEXITY_COUNCIL_MODEL || 'sonar-pro' }}
          XAI_COUNCIL_MODEL: ${{ vars.XAI_COUNCIL_MODEL || 'grok-4.6' }}
        run: python product-discovery/multimodel_council.py "${{ inputs.package_path }}"
      - name: Verify provenance and fail-closed synthesis invariants
        run: |
          python - <<'PY'
          import json
          r=json.load(open('product-discovery/run-output/council-latest.json'))
          assert r['schema'] == 'jakeai.council.v3'
          for name,m in r['members'].items():
              if m.get('participated'):
                  assert m.get('status') == 'SUCCESS'
                  assert m.get('request_id') or m.get('received_at')
                  assert m.get('response_sha256')
                  assert m.get('analysis',{}).get('verdict') in {'PASS_WITH_GATES','HOLD','REJECT'}
          if r['synthesis']['decision'] == 'PASS_WITH_GATES_ALL_SEATS':
              assert r['participating_count'] == 5
              assert r['synthesis']['all_five_participated'] is True
              assert r['synthesis']['verdict_counts']['PASS_WITH_GATES'] == 5
          print('Council provenance gate passed:', r['status'], 'decision:', r['synthesis']['decision'], 'verified participants:', r['participating_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multimodel-council-report
          path: product-discovery/run-output/council-latest.json
          retention-days: 30
