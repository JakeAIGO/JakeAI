name: MANTLEBREAK Cabinet Export

on:
  workflow_dispatch:
  push:
    branches: ["mantlebreak-arcade"]
    paths:
      - "mantlebreak-recovered-source/**"
      - ".github/workflows/mantlebreak-cabinet-export.yml"

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Parse and boot gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path mantlebreak-recovered-source --editor --quit 2>&1 | tee cabinet-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" cabinet-import.log
          godot --headless --path mantlebreak-recovered-source --quit-after 5 2>&1 | tee cabinet-startup.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid get index|Invalid call|Failed to load|Cannot open" cabinet-startup.log

      - name: Install Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export cabinet candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mantlebreak-recovered-source/build/windows
          godot --headless --path mantlebreak-recovered-source --export-release "Windows Desktop" build/windows/MANTLEBREAK.exe 2>&1 | tee cabinet-export.log
          test -s mantlebreak-recovered-source/build/windows/MANTLEBREAK.exe
          (
            cd mantlebreak-recovered-source/build/windows
            sha256sum MANTLEBREAK.exe > SHA256.txt
            sha256sum -c SHA256.txt
          )
          cat > mantlebreak-recovered-source/build/windows/CABINET_BUILD.txt <<'EOF'
          JakeAI Arcade
          Blazed Trail Studios
          MANTLEBREAK
          Cabinet Candidate v0.1

          Development controls:
          F1 = CREDIT
          ENTER = START
          F2 = OPERATOR
          Arrow keys = joystick
          J = DRILL
          K = SHOCK
          L = SHIELD
          I = BOOST

          This is a test candidate, not a commercial release.
          Trademark/name clearance and physical-cabinet validation remain required.
          EOF
          cat > mantlebreak-recovered-source/build/windows/PLAYTEST_GATE.txt <<'EOF'
          MANTLEBREAK CABINET PLAYTEST GATE

          1. Verify SHA256.txt before launch.
          2. Launch MANTLEBREAK.exe on Windows 10/11 x64.
          3. Confirm boot reaches JakeAI Arcade attract mode without exposing desktop UI.
          4. Confirm F1 adds credit when free play is disabled.
          5. Confirm ENTER starts a run.
          6. Confirm arrows move/dig; J DRILL; K SHOCK; L SHIELD; I BOOST.
          7. Confirm procedural audio is audible for dig, ore, DRILL, SHOCK, SHIELD, BOOST, hurt, boss warning, extraction.
          8. Confirm PRESSURE rises with aggressive scoring/BOOST, decays over time, and breaks on damage.
          9. Confirm F2 opens operator mode outside active play; test free play, credits/game, difficulty, attract audio, volume, diagnostics, high-score reset.
          10. Complete or intentionally lose a run; confirm score/initials flow returns to attract mode.
          11. Relaunch; confirm settings and high scores persist.
          12. Record any crash, stuck state, inaudible cue, control ambiguity, or pacing issue.

          PASS requires all functional checks above with no crash or unrecoverable state.
          Physical USB encoder/joystick validation is a separate gate.
          EOF

      - name: Upload cabinet candidate
        uses: actions/upload-artifact@v4
        with:
          name: MANTLEBREAK-Windows-Cabinet-v0.1
          path: mantlebreak-recovered-source/build/windows/
          retention-days: 30

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANTLEBREAK-Cabinet-QA-Logs
          path: |
            cabinet-import.log
            cabinet-startup.log
            cabinet-export.log
          retention-days: 14
