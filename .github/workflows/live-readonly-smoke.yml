name: Live Read-Only Smoke

on:
  push:
    branches:
      - fix/website-truthfulness-audit-2026-09-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run read-only production smoke checks
        run: python tools/live_readonly_smoke.py
