name: Insurance Growth Desk Tests

on:
  pull_request:
    paths:
      - "insurance_growth_desk.py"
      - "insurance-growth-desk/**"
      - "tests/test_insurance_growth_desk.py"
      - "commerce_recovery_app.py"
      - ".github/workflows/insurance-growth-desk-tests.yml"
  push:
    branches:
      - "feature/jim-insurance-growth-desk"
    paths:
      - "insurance_growth_desk.py"
      - "insurance-growth-desk/**"
      - "tests/test_insurance_growth_desk.py"
      - "commerce_recovery_app.py"
      - ".github/workflows/insurance-growth-desk-tests.yml"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Compile insurance runtime
        run: python -m py_compile insurance_growth_desk.py commerce_recovery_app.py
      - name: Run insurance pilot tests
        run: pytest -q tests/test_insurance_growth_desk.py
