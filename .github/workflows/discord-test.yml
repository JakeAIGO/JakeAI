name: JakeAI Discord Launch Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-test.yml'

jobs:
  send-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send JakeAI Infinite Foundry launch announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY' > payload.json
          import json
          payload = {
            "username": "JakeAI",
            "allowed_mentions": {"parse": []},
            "content": "📖 **NOW LIVE: JakeAI Universe — The Infinite Foundry**",
            "embeds": [
              {
                "title": "The Infinite Foundry — Founding Reader Edition",
                "url": "https://jakeaiofficial.com/infinite-foundry.html",
                "description": "A premium illustrated branching adventure in literal book form: **100 numbered sections, 10 endings, hidden routes, collectible keys, saved progress, and tactile page turns.**",
                "color": 13998677,
                "fields": [
                  {"name": "Founding Reader #0001", "value": "**$1.99 one time.** The #0001 checkout is limited to one completed purchase.", "inline": False},
                  {"name": "JakeAI advice", "value": "Seriously. Don't buy it. It's probably how this whole thing starts.", "inline": False},
                  {"name": "Open the book", "value": "https://jakeaiofficial.com/infinite-foundry.html", "inline": False}
                ],
                "image": {"url": "https://jakeaiofficial.com/assets/infinite-foundry-leather-cover.jpg?v=20260923-final"},
                "footer": {"text": "JakeAI Universe • Book 001 • Founding Reader Edition"}
              }
            ]
          }
          print(json.dumps(payload))
          PY
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
