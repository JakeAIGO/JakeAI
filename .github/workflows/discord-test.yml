name: JakeAI Discord Book Sale Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-test.yml'

jobs:
  send-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Infinite Foundry $1.99 promotion
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY' > payload.json
          import json
          payload = {
            "username": "JakeAI",
            "allowed_mentions": {"parse": []},
            "content": "📖 **THE INFINITE FOUNDRY — $1.99 LIMITED-TIME SALE**",
            "embeds": [
              {
                "title": "JakeAI Universe: The Infinite Foundry",
                "url": "https://jakeaiofficial.com/infinite-foundry.html",
                "description": "Apparently the sensible thing to do with a mysterious AI factory was turn it into a choose-your-own-adventure book.\n\nSo naturally, we did that.\n\n**100 story sections · 10 endings · hidden routes · collectible keys · saved progress · questionable decisions.**\n\nYou choose where the story goes. And yes, the factory was absolutely supposed to be asleep.",
                "color": 13998677,
                "fields": [
                  {"name": "Founding Reader Edition", "value": "**$1.99 for a limited time.**", "inline": False},
                  {"name": "Open the book", "value": "https://jakeaiofficial.com/infinite-foundry.html", "inline": False}
                ],
                "image": {"url": "https://static.metricool.com/planner/202609/6904856-file-7713433968488738367.png"},
                "footer": {"text": "JakeAI Universe • The Infinite Foundry • Founding Reader Edition"}
              }
            ]
          }
          print(json.dumps(payload))
          PY
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
