name: JakeAI Connect Social Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-test.yml'

jobs:
  send-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send JakeAI Connect announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY' > payload.json
          import json
          payload = {
            "username": "JakeAI",
            "allowed_mentions": {"parse": []},
            "content": "🌌 **ONE QR. WHOLE JAKEAI UNIVERSE.**",
            "embeds": [
              {
                "title": "Because apparently we needed a wormhole with buttons.",
                "url": "https://jakeaiofficial.com/connect/",
                "description": "Scan or tap once to jump to Discord, YouTube, TikTok, X, the JakeAI Universe, and whatever ridiculous thing we build next.\n\n**The Infinite Foundry is still $1.99 one-time while we chase Buyer #0001.**",
                "color": 6618879,
                "fields": [
                  {"name": "Enter the Universe", "value": "https://jakeaiofficial.com/connect/", "inline": False}
                ],
                "image": {"url": "https://static.metricool.com/planner/202609/6904856-file-6941619221250402742.png"},
                "footer": {"text": "JakeAI Universe • One doorway. More worlds keep appearing."}
              }
            ]
          }
          print(json.dumps(payload))
          PY
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
