name: Commerce Wallet CI
on:
  pull_request:
    paths:
      - 'commerce_app.py'
      - 'crypto_commerce_app.py'
      - 'crypto_payment_*.py'
      - 'tests/test_commerce_entitlements.py'
      - 'tests/test_crypto_*.py'
      - '.github/workflows/commerce-wallet-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run commerce and crypto regression suite
        env:
          CRYPTO_PAYMENTS_ENABLED: 'false'
          CRYPTO_LEGAL_APPROVED: 'false'
          CRYPTO_AUTO_FULFILL_ENABLED: 'false'
        run: pytest -q tests/test_commerce_entitlements.py tests/test_crypto_commerce_app.py tests/test_crypto_payment_adapter.py tests/test_crypto_payment_integration.py tests/test_crypto_payment_rpc.py
