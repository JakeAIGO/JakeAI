name: JakeAI Opportunity Radar Test

on:
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Live Public News
        run: |
          python product-discovery/news_ingestor.py 40

      - name: Run Opportunity Radar Across Live Signals
        shell: bash
        run: |
          count=0

          for signal in product-discovery/live-signals/*.json; do
            if [ -f "$signal" ]; then
              echo ""
              echo "======================================================================"
              echo "EVALUATING: $signal"
              echo "======================================================================"

              python product-discovery/opportunity_radar.py "$signal"
              count=$((count + 1))
            fi
          done

          echo ""
          echo "Signals evaluated: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No live signals were captured."
            exit 1
          fi

      - name: Enrich Signals Needing More Evidence
        run: |
          python product-discovery/evidence_enricher.py

      - name: Preserve First-Pass Radar Results
        shell: bash
        run: |
          mkdir -p product-discovery/radar-first-pass

          cp product-discovery/radar-output/*.json \
             product-discovery/radar-first-pass/ 2>/dev/null || true

      - name: Re-score Enriched Signals
        shell: bash
        run: |
          count=0

          for signal in product-discovery/enriched-signals/*.json; do
            if [ -f "$signal" ]; then
              echo ""
              echo "======================================================================"
              echo "RE-SCORING ENRICHED SIGNAL: $signal"
              echo "======================================================================"

              python product-discovery/opportunity_radar.py "$signal"
              count=$((count + 1))
            fi
          done

          echo ""
          echo "Enriched signals re-scored: $count"

          if [ "$count" -eq 0 ]; then
            echo "No enriched signals were available for re-scoring."
          fi

      - name: Cluster Promoted Opportunities
        run: |
          python product-discovery/opportunity_clusterer.py

      - name: Convert Qualified Clusters To Product Discovery Inputs
        run: |
          python product-discovery/cluster_to_discovery.py

      - name: Run Product Discovery On Qualified Clusters
        shell: bash
        run: |
          count=0

          for candidate in product-discovery/discovery-inputs/*.json; do
            if [ -f "$candidate" ]; then
              echo ""
              echo "======================================================================"
              echo "RUNNING PRODUCT DISCOVERY: $candidate"
              echo "======================================================================"

              python product-discovery/discovery_engine.py "$candidate"
              count=$((count + 1))
            fi
          done

          echo ""
          echo "Discovery inputs evaluated: $count"

          if [ "$count" -eq 0 ]; then
            echo "No qualified cluster reached Product Discovery."
          fi

      - name: Summarize Test 10 Results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          counts = {
              "PROMOTE_TO_DISCOVERY": 0,
              "NEEDS_MORE_EVIDENCE": 0,
              "REJECT_NOISE": 0,
          }

          promoted = []

          for path in Path(
              "product-discovery/radar-output"
          ).glob("*.json"):

              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              disposition = data.get(
                  "disposition",
                  "UNKNOWN",
              )

              counts[disposition] = (
                  counts.get(disposition, 0) + 1
              )

              if disposition == "PROMOTE_TO_DISCOVERY":
                  promoted.append(
                      {
                          "score": data.get(
                              "radar_score",
                              0,
                          ),
                          "title": data.get(
                              "title",
                              "Untitled",
                          ),
                          "industry": data.get(
                              "industry",
                              "Unknown",
                          ),
                      }
                  )

          print("=" * 72)
          print("JAKEAI AUTONOMOUS OPPORTUNITY PIPELINE — TEST 10")
          print("=" * 72)

          print()
          print("RADAR RESULTS")

          for key, value in counts.items():
              print(f"{key}: {value}")

          print()
          print("TOP PROMOTED OPPORTUNITIES")

          if not promoted:
              print("None promoted during this scan.")
          else:
              for item in sorted(
                  promoted,
                  key=lambda x: x["score"],
                  reverse=True,
              )[:10]:
                  print(
                      f"{item['score']}/100 | "
                      f"{item['industry']} | "
                      f"{item['title']}"
                  )

          cluster_index = Path(
              "product-discovery/opportunity-clusters/index.json"
          )

          cluster_count = 0

          if cluster_index.exists():
              cluster_data = json.loads(
                  cluster_index.read_text(
                      encoding="utf-8"
                  )
              )

              cluster_count = cluster_data.get(
                  "cluster_count",
                  0,
              )

              print()
              print("SYNTHESIZED OPPORTUNITY CLUSTERS")
              print(
                  "Promoted signals: "
                  f"{cluster_data.get('promoted_signal_count', 0)}"
              )
              print(
                  f"Opportunity clusters: {cluster_count}"
              )

              for cluster in sorted(
                  cluster_data.get(
                      "clusters",
                      [],
                  ),
                  key=lambda x: x.get(
                      "cluster_score",
                      0,
                  ),
                  reverse=True,
              ):
                  print(
                      f"{cluster.get('cluster_score', 0)}/100 | "
                      f"{cluster.get('industry', 'Unknown')} | "
                      f"{cluster.get('signal_count', 0)} signals | "
                      f"{cluster.get('problem_statement', 'Unknown problem')} | "
                      f"{cluster.get('recommended_next_action', 'UNKNOWN')}"
                  )

          discovery_inputs = list(
              Path(
                  "product-discovery/discovery-inputs"
              ).glob("*.json")
          )

          blocked = list(
              Path(
                  "product-discovery/discovery-blocked"
              ).glob("*.json")
          )

          candidates = list(
              Path(
                  "product-discovery/candidates"
              ).glob("*.json")
          )

          print()
          print("CLUSTER -> DISCOVERY TRANSFER")
          print(
              f"Discovery inputs created: "
              f"{len(discovery_inputs)}"
          )
          print(
              f"Transfers blocked: "
              f"{len(blocked)}"
          )

          print()
          print("PRODUCT DISCOVERY RESULTS")
          print(
              f"Candidate records created: "
              f"{len(candidates)}"
          )

          for path in candidates:
              try:
                  data = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  print(
                      f"{data.get('score', 0)}/100 | "
                      f"{data.get('status', 'UNKNOWN')} | "
                      f"{data.get('industry', 'Unknown')} | "
                      f"{data.get('proposed_skill', 'Unnamed skill')}"
                  )
              except Exception as error:
                  print(
                      f"Could not summarize "
                      f"{path.name}: {error}"
                  )

          print()
          print("PIPELINE")
          print(
              "LIVE SIGNALS -> RADAR -> ENRICHMENT -> "
              "RE-SCORE -> CLUSTERING -> DISCOVERY INPUT -> "
              "PRODUCT DISCOVERY -> CANDIDATE"
          )

          print("=" * 72)
          PY

      - name: Upload Live News Signals
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-live-signals
          path: product-discovery/live-signals/
          if-no-files-found: warn

      - name: Upload First-Pass Radar Results
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-first-pass
          path: product-discovery/radar-first-pass/
          if-no-files-found: warn

      - name: Upload Evidence Enrichment
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-evidence
          path: product-discovery/enriched-signals/
          if-no-files-found: warn

      - name: Upload Final Radar Results
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-final-results
          path: product-discovery/radar-output/
          if-no-files-found: warn

      - name: Upload Synthesized Opportunity Clusters
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-clusters
          path: product-discovery/opportunity-clusters/
          if-no-files-found: warn

      - name: Upload Product Discovery Inputs
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-discovery-inputs
          path: product-discovery/discovery-inputs/
          if-no-files-found: warn

      - name: Upload Blocked Discovery Transfers
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-discovery-blocked
          path: product-discovery/discovery-blocked/
          if-no-files-found: warn

      - name: Upload Product Discovery Candidates
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-radar-product-candidates
          path: product-discovery/candidates/
          if-no-files-found: warn
