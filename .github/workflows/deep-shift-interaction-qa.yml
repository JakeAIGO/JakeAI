name: Deep Shift Interaction QA

on:
  workflow_dispatch:
  push:
    branches: ["deep-shift-ci"]
    paths:
      - ".github/workflows/deep-shift-interaction-qa.yml"

permissions:
  contents: read

jobs:
  interaction-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Hydrate playable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deep-shift-interaction
          cat deep-shift-ci/full_game_bundle.part01 deep-shift-ci/full_game_bundle.part02 deep-shift-ci/full_game_bundle.part03 deep-shift-ci/full_game_bundle.part04 deep-shift-ci/full_game_bundle.part05 deep-shift-ci/full_game_bundle.part06 > /tmp/full.b64
          base64 -d /tmp/full.b64 > /tmp/full.tar.gz
          tar -xzf /tmp/full.tar.gz -C deep-shift-interaction
          sed -i 's/var requirement := 0 if sector_index == 4 else min(int(sector_data.ore_count), 5 + sector_index)/var requirement: int = 0 if sector_index == 4 else int(min(int(sector_data.ore_count), 5 + sector_index))/' deep-shift-interaction/scripts/Game.gd || true
          sed -i 's/var tech := max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000))/var tech: int = int(max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000)))/' deep-shift-interaction/scripts/Game.gd || true
          cat > deep-shift-interaction/scripts/AudioManager.gd <<'GDSCRIPT'
          extends Node
          func play(_id: String, _pitch: float = 1.0) -> void: pass
          GDSCRIPT
      - name: Add interaction probe
        shell: bash
        run: |
          cat > deep-shift-interaction/scripts/InteractionCheck.gd <<'GDSCRIPT'
          extends Node
          var failures: Array[String] = []
          func check(v: bool, label: String) -> void:
              if not v:
                  failures.append(label)
                  push_error("INTERACTION CHECK FAILED: " + label)
          func _ready() -> void:
              await get_tree().process_frame
              print("INTERACTION_STAGE: boot")
              GameState.reset_run()
              var packed: PackedScene = load("res://scenes/Game.tscn")
              check(packed != null, "Game.tscn loads")
              if packed == null: finish(); return
              var game: Node = packed.instantiate()
              add_child(game)
              await get_tree().process_frame
              await get_tree().process_frame
              print("INTERACTION_STAGE: game-instantiated")
              var player: Node = game.get("player") as Node
              check(player != null, "player exists")
              if player == null: finish(); return
              var e0: int = int(GameState.run.energy)
              if player.has_method("drain_energy"):
                  player.call("drain_energy", 7)
                  await get_tree().process_frame
                  check(int(GameState.run.energy) == e0 - 7, "energy drain applies")
              print("INTERACTION_STAGE: energy")
              if game.has_method("collect_ore"):
                  var o0: int = int(game.get("ore_collected"))
                  var c0: int = int(GameState.run.credits)
                  GameState.run.energy = int(GameState.run.max_energy) - 20
                  var eb: int = int(GameState.run.energy)
                  game.call("collect_ore")
                  await get_tree().process_frame
                  check(int(game.get("ore_collected")) == o0 + 1, "ore pickup increments ore")
                  check(int(GameState.run.credits) == c0 + 10, "ore pickup grants credits")
                  check(int(GameState.run.energy) >= eb, "ore pickup restores/preserves energy")
              print("INTERACTION_STAGE: ore")
              var max0: int = int(GameState.run.max_energy)
              GameState.apply_upgrade("battery")
              check(int(GameState.run.max_energy) > max0, "battery upgrade increases max energy")
              print("INTERACTION_STAGE: upgrade")
              game.call("start_sector", 4)
              await get_tree().process_frame
              check(int(game.get("sector_index")) == 4, "boss sector initializes")
              check(bool(game.get("boss_alive")), "boss encounter is active")
              var boss: Node = null
              for child in game.get_children():
                  if child != null and child.has_method("take_damage") and child.get_class() != "CharacterBody2D":
                      boss = child
              if boss == null:
                  for n in game.find_children("*", "", true, false):
                      if n.has_method("take_damage") and str(n.name).to_lower().contains("boss"):
                          boss = n
                          break
              if boss != null:
                  for i in range(12):
                      if not is_instance_valid(boss): break
                      boss.call("take_damage", 2)
                      await get_tree().process_frame
                  check(not bool(game.get("boss_alive")), "boss can be defeated")
              else:
                  failures.append("boss node discoverable")
              print("INTERACTION_STAGE: boss")
              finish()
          func finish() -> void:
              if failures.is_empty():
                  print("DEEP_SHIFT_INTERACTION_GATE: PASS")
                  get_tree().quit(0)
              else:
                  print("DEEP_SHIFT_INTERACTION_GATE: FAIL")
                  for f in failures: print(" - " + f)
                  get_tree().quit(1)
          GDSCRIPT
          cat > deep-shift-interaction/scenes/InteractionCheck.tscn <<'TSCN'
          [gd_scene load_steps=2 format=3]
          [ext_resource path="res://scripts/InteractionCheck.gd" type="Script" id="1"]
          [node name="InteractionCheck" type="Node"]
          script = ExtResource("1")
          TSCN
      - name: Import full game
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-interaction --editor --quit 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log
      - name: Run interaction gate
        shell: bash
        run: |
          set -o pipefail
          timeout 35s godot --headless --path deep-shift-interaction --scene res://scenes/InteractionCheck.tscn 2>&1 | tee interaction.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid get index|Invalid call|Failed to load|Cannot open" interaction.log
          grep -q "DEEP_SHIFT_INTERACTION_GATE: PASS" interaction.log
      - name: Preserve interaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepShift-Interaction-QA-Logs
          path: |
            import.log
            interaction.log
          retention-days: 30
