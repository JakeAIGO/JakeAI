name: JakeAI Product Development Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [codex-setup, main]

permissions:
  contents: read

jobs:
  stage3-development-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage 3 Regression Tests
        run: python product-discovery/test_development_evidence_gate.py

      - name: Run Stage 2 Validation Gate
        run: |
          mkdir -p product-discovery/validation
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          signal_path = Path("product-discovery/signals/signal-001-grid-site-selection.json")
          signal = json.loads(signal_path.read_text(encoding="utf-8"))
          evidence = [item for item in signal.get("evidence", []) if item]
          source_urls = [item for item in signal.get("source_urls", []) if item]
          source_count = len(set(source_urls))
          evidence_count = len(evidence)
          score = min(100, (source_count * 20) + (evidence_count * 10))

          result = {
              "candidate_title": signal.get("title"),
              "industry": signal.get("industry"),
              "target_buyer": signal.get("target_buyer"),
              "proposed_skill": signal.get("proposed_skill"),
              "stage": "VALIDATION_V0_1",
              "evidence_count": evidence_count,
              "independent_source_count": source_count,
              "source_urls": source_urls,
              "supporting_evidence": evidence,
              "counter_evidence": [],
              "validation_score": score,
              "disposition": (
                  "READY_FOR_INDEPENDENT_VALIDATION"
                  if source_count >= 3
                  else "INSUFFICIENT_INDEPENDENT_EVIDENCE"
              ),
              "independently_validated": False,
              "publication_authorized": False,
              "spending_authorized": False,
              "build_authorized": False,
              "human_approval_required": True,
              "risks": signal.get("risks", []),
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }

          Path("product-discovery/validation/product-validation-001.json").write_text(
              json.dumps(result, indent=2), encoding="utf-8"
          )
          print(json.dumps({"validation_score": score, "source_count": source_count}, indent=2))
          PY

      - name: Run Stage 3 Development Evidence Gate
        run: |
          python product-discovery/development_evidence_gate.py \
            product-discovery/validation/product-validation-001.json \
            product-discovery/development/product-development-001.json

      - name: Verify Consequential Permissions Remain Closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("product-discovery/development/product-development-001.json")
          result = json.loads(path.read_text(encoding="utf-8"))

          for field in (
              "build_authorized",
              "spending_authorized",
              "publication_authorized",
              "deployment_authorized",
              "checkout_authorized",
          ):
              if result.get(field) is not False:
                  raise SystemExit(f"Fail-closed invariant violated: {field}")

          if result.get("human_approval_required") is not True:
              raise SystemExit("Human approval invariant violated")

          if result.get("route") not in {"DEVELOP", "HOLD", "REJECT"}:
              raise SystemExit("Unexpected Stage 3 route")

          print(f"Stage 3 route: {result['route']}")
          print("All consequential permissions remain closed.")
          PY

      - name: Upload Stage 3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-development-evidence-001
          path: product-discovery/development/product-development-001.json
