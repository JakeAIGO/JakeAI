name: Deep Shift Runtime QA

on:
  workflow_dispatch:
  push:
    branches: ["deep-shift-ci"]
    paths:
      - "deep-shift-ci/**"
      - ".github/workflows/deep-shift-runtime-qa.yml"

jobs:
  runtime-qa-and-playable-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Validate deterministic CI harness
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-ci --editor --quit 2>&1 | tee harness-import.log
          ! grep -E "SCRIPT ERROR|ERROR:" harness-import.log
          godot --headless --path deep-shift-ci --scene res://scenes/CompileCheck.tscn 2>&1 | tee compile.log
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" compile.log
          godot --headless --path deep-shift-ci --scene res://scenes/SmokeTest.tscn 2>&1 | tee smoke.log
          grep -q "DEEP_SHIFT_SMOKE_TEST: PASS" smoke.log
          godot --headless --path deep-shift-ci --scene res://scenes/PlaytestRunner.tscn 2>&1 | tee playtest.log
          grep -q "DEEP_SHIFT_BALANCE_GATE: PASS" playtest.log
      - name: Hydrate and patch full playable source tree
        shell: bash
        run: |
          set -e
          rm -rf deep-shift-full && mkdir -p deep-shift-full
          cat deep-shift-ci/full_game_bundle.part01 deep-shift-ci/full_game_bundle.part02 deep-shift-ci/full_game_bundle.part03 deep-shift-ci/full_game_bundle.part04 deep-shift-ci/full_game_bundle.part05 deep-shift-ci/full_game_bundle.part06 > /tmp/deep_shift_full.b64
          test "$(wc -c < /tmp/deep_shift_full.b64)" -eq 33548
          base64 -d /tmp/deep_shift_full.b64 > /tmp/deep_shift_full.tar.gz
          tar -xzf /tmp/deep_shift_full.tar.gz -C deep-shift-full
          printf 'extends Node\nfunc play(_id: String, _pitch := 1.0) -> void:\n    pass\n' > deep-shift-full/scripts/AudioManager.gd
          sed -i 's/var requirement := 0 if sector_index == 4 else min(int(sector_data.ore_count), 5 + sector_index)/var requirement: int = 0 if sector_index == 4 else int(min(int(sector_data.ore_count), 5 + sector_index))/' deep-shift-full/scripts/Game.gd
          sed -i 's/var tech := max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000))/var tech: int = int(max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000)))/' deep-shift-full/scripts/Game.gd
      - name: Import and compile full playable
        run: |
          godot --headless --path deep-shift-full --editor --quit 2>&1 | tee full-import.log
          ! grep -E "SCRIPT ERROR|ERROR:" full-import.log
          godot --headless --path deep-shift-full --scene res://scenes/CompileCheck.tscn 2>&1 | tee full-compile.log
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" full-compile.log
      - name: Release candidate content gate
        run: |
          test -f deep-shift-full/scenes/Boss.tscn
          test -f deep-shift-full/scenes/ExtractionBeacon.tscn
          test -f deep-shift-full/scenes/UpgradePanel.tscn
          test -f deep-shift-full/data/asset_provenance_and_ip_manifest.json
          test -f deep-shift-full/data/game_manifest.json
          echo 'DEEP_SHIFT_RELEASE_CANDIDATE_GATE: PASS'
      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Export Windows release candidate
        run: |
          mkdir -p deep-shift-full/build/windows
          godot --headless --path deep-shift-full --export-release "Windows Desktop" build/windows/DeepShift.exe
          test -s deep-shift-full/build/windows/DeepShift.exe
          sha256sum deep-shift-full/build/windows/DeepShift.exe > deep-shift-full/build/windows/SHA256.txt
          printf 'Blazed Trail Studios\nDeep Shift\nWindows Release Candidate\n' > deep-shift-full/build/windows/BUILD_IDENTITY.txt
      - name: Configure Android SDK and export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -x "$SDK_ROOT/platform-tools/adb"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          fi
          mkdir -p "$HOME/.android"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$DEBUG_KEYSTORE"
          godot --headless --editor --path deep-shift-full --quit
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          test -f "$SETTINGS"
          sed -i "/^\[resource\]/a export/android/android_sdk_path = \"$SDK_ROOT\"\nexport/android/java_sdk_path = \"$JAVA_HOME\"" "$SETTINGS"
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$SETTINGS"
          cat >> deep-shift-full/export_presets.cfg <<'EOF'

          [preset.1]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/DeepShift.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.1.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.blazedtrail.deepshift"
          package/name="Deep Shift"
          package/signed=true
          version/code=1
          version/name="0.1-rc"
          screen/immersive_mode=true
          EOF
          mkdir -p deep-shift-full/build/android
          godot --headless --path deep-shift-full --export-debug "Android" build/android/DeepShift.apk 2>&1 | tee export-android.log
          test -s deep-shift-full/build/android/DeepShift.apk
          unzip -t deep-shift-full/build/android/DeepShift.apk >/dev/null
          sha256sum deep-shift-full/build/android/DeepShift.apk > deep-shift-full/build/android/SHA256.txt
          printf 'Blazed Trail Studios\nDeep Shift\nAndroid Test Build\n' > deep-shift-full/build/android/BUILD_IDENTITY.txt
      - name: Upload Windows release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepShift-Windows-Release-Candidate
          path: deep-shift-full/build/windows/
          retention-days: 90
      - name: Upload Android test build
        uses: actions/upload-artifact@v4
        with:
          name: DeepShift-Android-Test-Build
          path: deep-shift-full/build/android/
          retention-days: 90
