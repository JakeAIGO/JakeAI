name: Deep Shift Runtime QA

on:
  workflow_dispatch:
  push:
    branches: ["deep-shift-ci"]
    paths:
      - "deep-shift-ci/**"
      - ".github/workflows/deep-shift-runtime-qa.yml"

jobs:
  runtime-qa-and-playable-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Validate deterministic CI harness
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-ci --editor --quit 2>&1 | tee harness-import.log
          if grep -E "SCRIPT ERROR|ERROR:" harness-import.log; then exit 1; fi
          godot --headless --path deep-shift-ci --scene res://scenes/CompileCheck.tscn 2>&1 | tee compile.log
          if grep -E "SCRIPT ERROR|ERROR:" compile.log; then exit 1; fi
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" compile.log
          godot --headless --path deep-shift-ci --scene res://scenes/SmokeTest.tscn 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|ERROR:" smoke.log; then exit 1; fi
          grep -q "DEEP_SHIFT_SMOKE_TEST: PASS" smoke.log
          godot --headless --path deep-shift-ci --scene res://scenes/PlaytestRunner.tscn 2>&1 | tee playtest.log
          if grep -E "SCRIPT ERROR|ERROR:" playtest.log; then exit 1; fi
          grep -q "DEEP_SHIFT_BALANCE_GATE: PASS" playtest.log

      - name: Hydrate and patch full playable source tree
        run: |
          rm -rf deep-shift-full
          mkdir -p deep-shift-full
          cat deep-shift-ci/full_game_bundle.part01 deep-shift-ci/full_game_bundle.part02 deep-shift-ci/full_game_bundle.part03 deep-shift-ci/full_game_bundle.part04 deep-shift-ci/full_game_bundle.part05 deep-shift-ci/full_game_bundle.part06 > /tmp/deep_shift_full.b64
          test "$(wc -c < /tmp/deep_shift_full.b64)" -eq 33548
          base64 -d /tmp/deep_shift_full.b64 > /tmp/deep_shift_full.tar.gz
          tar -tzf /tmp/deep_shift_full.tar.gz >/dev/null
          tar -xzf /tmp/deep_shift_full.tar.gz -C deep-shift-full
          test -f deep-shift-full/project.godot
          test -f deep-shift-full/scenes/Main.tscn
          grep -q 'run/main_scene="res://scenes/Main.tscn"' deep-shift-full/project.godot
          grep -q 'BLAZED TRAIL STUDIOS PRESENTS' deep-shift-full/scenes/Main.tscn
          cat > deep-shift-full/scripts/AudioManager.gd <<'EOF'
          extends Node
          func play(_id: String, _pitch := 1.0) -> void:
              pass
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('deep-shift-full/scripts/Game.gd')
          s=p.read_text()
          s=s.replace('var requirement := 0 if sector_index == 4 else min(int(sector_data.ore_count), 5 + sector_index)', 'var requirement: int = 0 if sector_index == 4 else int(min(int(sector_data.ore_count), 5 + sector_index))')
          s=s.replace('var tech := max(1, int(depth / 2) + (3 if success else 0) + int(GameState.run.score / 3000))', 'var tech: int = int(max(1, int(depth / 2) + (3 if success else 0) + int(GameState.run.score / 3000)))')
          p.write_text(s)
          PY

      - name: Import full playable game with strict log gate
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-full --editor --quit 2>&1 | tee full-import.log
          if grep -E "SCRIPT ERROR|ERROR:" full-import.log; then exit 1; fi

      - name: Compile full playable gameplay scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-full --scene res://scenes/CompileCheck.tscn 2>&1 | tee full-compile.log
          if grep -E "SCRIPT ERROR|ERROR:" full-compile.log; then exit 1; fi
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" full-compile.log

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export playable Windows build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p deep-shift-full/build
          godot --headless --path deep-shift-full --export-release "Windows Desktop" deep-shift-full/build/DeepShift.exe 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|ERROR:" export.log; then exit 1; fi
          test -s deep-shift-full/build/DeepShift.exe
          file deep-shift-full/build/DeepShift.exe
          sha256sum deep-shift-full/build/DeepShift.exe | tee deep-shift-full/build/SHA256.txt
          printf 'Blazed Trail Studios\nDeep Shift\nPlayable Promotion Build\n' > deep-shift-full/build/BUILD_IDENTITY.txt

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DeepShift-Windows-Playable-Promotion
          path: deep-shift-full/build/
          retention-days: 90
