name: Deep Shift Runtime QA

on:
  workflow_dispatch:
  push:
    branches: ["deep-shift-ci"]
    paths:
      - "deep-shift-ci/**"
      - ".github/workflows/deep-shift-runtime-qa.yml"

jobs:
  runtime-qa-and-playable-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Validate deterministic CI harness
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-ci --editor --quit 2>&1 | tee harness-import.log
          ! grep -E "SCRIPT ERROR|ERROR:" harness-import.log
          godot --headless --path deep-shift-ci --scene res://scenes/CompileCheck.tscn 2>&1 | tee compile.log
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" compile.log
          godot --headless --path deep-shift-ci --scene res://scenes/SmokeTest.tscn 2>&1 | tee smoke.log
          grep -q "DEEP_SHIFT_SMOKE_TEST: PASS" smoke.log
          godot --headless --path deep-shift-ci --scene res://scenes/PlaytestRunner.tscn 2>&1 | tee playtest.log
          grep -q "DEEP_SHIFT_BALANCE_GATE: PASS" playtest.log

      - name: Hydrate and normalize full playable source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deep-shift-full && mkdir -p deep-shift-full
          cat deep-shift-ci/full_game_bundle.part01 deep-shift-ci/full_game_bundle.part02 deep-shift-ci/full_game_bundle.part03 deep-shift-ci/full_game_bundle.part04 deep-shift-ci/full_game_bundle.part05 deep-shift-ci/full_game_bundle.part06 > /tmp/deep_shift_full.b64
          test "$(wc -c < /tmp/deep_shift_full.b64)" -eq 33548
          base64 -d /tmp/deep_shift_full.b64 > /tmp/deep_shift_full.tar.gz
          tar -xzf /tmp/deep_shift_full.tar.gz -C deep-shift-full
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path('deep-shift-full/project.godot')
          text = project.read_text()
          text = text.replace('Shiftforge Games', 'Blazed Trail Studios')
          if re.search(r'^run/main_scene=.*$', text, flags=re.M):
              text = re.sub(r'^run/main_scene=.*$', 'run/main_scene="res://scenes/Main.tscn"', text, flags=re.M)
          else:
              text = text.replace('[application]', '[application]\nrun/main_scene="res://scenes/Main.tscn"', 1)
          project.write_text(text)
          main = Path('deep-shift-full/scenes/Main.tscn')
          scene = main.read_text().replace('Shiftforge Games','Blazed Trail Studios')
          if 'Blazed Trail Studios' not in scene:
              scene += '''\n[node name="BlazedTrailBrand" type="Label" parent="."]\noffset_left = 20.0\noffset_top = 18.0\noffset_right = 420.0\noffset_bottom = 48.0\ntext = "BLAZED TRAIL STUDIOS"\ntheme_override_font_sizes/font_size = 18\nz_index = 999\n'''
          main.write_text(scene)
          PY
          sed -i 's/var requirement := 0 if sector_index == 4 else min(int(sector_data.ore_count), 5 + sector_index)/var requirement: int = 0 if sector_index == 4 else int(min(int(sector_data.ore_count), 5 + sector_index))/' deep-shift-full/scripts/Game.gd
          sed -i 's/var tech := max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000))/var tech: int = int(max(1, int(depth \/ 2) + (3 if success else 0) + int(GameState.run.score \/ 3000)))/' deep-shift-full/scripts/Game.gd

      - name: Install procedural original audio engine
        shell: bash
        run: |
          cat > deep-shift-full/scripts/AudioManager.gd <<'GDSCRIPT'
          extends Node
          const MIX_RATE: float = 44100.0
          var player: AudioStreamPlayer
          var generator: AudioStreamGenerator
          var playback: AudioStreamGeneratorPlayback
          var rng_state: int = 123456789

          func _ready() -> void:
              generator = AudioStreamGenerator.new()
              generator.mix_rate = MIX_RATE
              generator.buffer_length = 0.5
              player = AudioStreamPlayer.new()
              player.name = "ProceduralAudioPlayer"
              player.stream = generator
              add_child(player)
              player.play()
              playback = player.get_stream_playback() as AudioStreamGeneratorPlayback

          func play(id: String, pitch: float = 1.0) -> void:
              if playback == null:
                  return
              var spec: Dictionary = _spec(id)
              var duration: float = float(spec.get("duration", 0.12))
              var f0: float = float(spec.get("f0", 220.0)) * pitch
              var f1: float = float(spec.get("f1", f0)) * pitch
              var amp: float = float(spec.get("amp", 0.25))
              var shape: String = str(spec.get("shape", "sine"))
              var count: int = int(MIX_RATE * duration)
              var frames := PackedVector2Array()
              frames.resize(count)
              for i in range(count):
                  var t: float = float(i) / MIX_RATE
                  var phase: float = float(i) / float(max(1, count - 1))
                  var freq: float = lerpf(f0, f1, phase)
                  var env: float = pow(1.0 - phase, 1.7)
                  var sample: float = _wave(shape, freq, t) * amp * env
                  frames[i] = Vector2(sample, sample)
              playback.clear_buffer()
              playback.push_buffer(frames)

          func _wave(shape: String, freq: float, t: float) -> float:
              var s: float = sin(TAU * freq * t)
              match shape:
                  "square": return 1.0 if s >= 0.0 else -1.0
                  "triangle": return asin(s) * (2.0 / PI)
                  "noise":
                      rng_state = int((1103515245 * rng_state + 12345) & 0x7fffffff)
                      return (float(rng_state) / 1073741823.5) - 1.0
                  "crunch":
                      rng_state = int((1103515245 * rng_state + 12345) & 0x7fffffff)
                      var noise: float = (float(rng_state) / 1073741823.5) - 1.0
                      return clamp(s * 0.65 + noise * 0.35, -1.0, 1.0)
                  _: return s

          func _spec(id: String) -> Dictionary:
              match id:
                  "dig": return {"duration":0.07,"f0":95.0,"f1":55.0,"amp":0.30,"shape":"crunch"}
                  "ore": return {"duration":0.16,"f0":620.0,"f1":980.0,"amp":0.22,"shape":"sine"}
                  "pulse": return {"duration":0.18,"f0":260.0,"f1":95.0,"amp":0.25,"shape":"triangle"}
                  "charge": return {"duration":0.22,"f0":80.0,"f1":42.0,"amp":0.32,"shape":"crunch"}
                  "hurt": return {"duration":0.12,"f0":125.0,"f1":65.0,"amp":0.32,"shape":"square"}
                  "boss_warning": return {"duration":0.30,"f0":72.0,"f1":48.0,"amp":0.30,"shape":"square"}
                  "extract": return {"duration":0.34,"f0":330.0,"f1":880.0,"amp":0.23,"shape":"sine"}
                  _: return {"duration":0.10,"f0":220.0,"f1":180.0,"amp":0.20,"shape":"sine"}
          GDSCRIPT
          cat > deep-shift-full/scripts/AudioRuntimeCheck.gd <<'GDSCRIPT'
          extends Node
          func _ready() -> void:
              await get_tree().process_frame
              for id in ["dig","ore","pulse","charge","hurt","boss_warning","extract"]:
                  Audio.play(id)
              print("DEEP_SHIFT_PROCEDURAL_AUDIO_GATE: PASS")
              get_tree().quit()
          GDSCRIPT
          cat > deep-shift-full/scenes/AudioRuntimeCheck.tscn <<'TSCN'
          [gd_scene load_steps=2 format=3]
          [ext_resource path="res://scripts/AudioRuntimeCheck.gd" type="Script" id="1"]
          [node name="AudioRuntimeCheck" type="Node"]
          script = ExtResource("1")
          TSCN

      - name: Import compile and audio-check full playable
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path deep-shift-full --editor --quit 2>&1 | tee full-import.log
          ! grep -E "SCRIPT ERROR|ERROR:" full-import.log
          godot --headless --path deep-shift-full --scene res://scenes/CompileCheck.tscn 2>&1 | tee full-compile.log
          ! grep -E "SCRIPT ERROR|ERROR:" full-compile.log
          grep -q "DEEP_SHIFT_GAMEPLAY_COMPILE_GATE: PASS" full-compile.log
          godot --headless --path deep-shift-full --scene res://scenes/AudioRuntimeCheck.tscn 2>&1 | tee audio.log
          ! grep -E "SCRIPT ERROR|ERROR:" audio.log
          grep -q "DEEP_SHIFT_PROCEDURAL_AUDIO_GATE: PASS" audio.log

      - name: Release candidate content gate
        run: |
          test -f deep-shift-full/scenes/Main.tscn
          test -f deep-shift-full/scenes/Game.tscn
          test -f deep-shift-full/scenes/Boss.tscn
          test -f deep-shift-full/scenes/ExtractionBeacon.tscn
          test -f deep-shift-full/scenes/UpgradePanel.tscn
          test -f deep-shift-full/scripts/AudioManager.gd
          grep -q 'run/main_scene="res://scenes/Main.tscn"' deep-shift-full/project.godot
          grep -qi 'Blazed Trail Studios' deep-shift-full/scenes/Main.tscn
          echo 'DEEP_SHIFT_RELEASE_CANDIDATE_GATE: PASS'

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export Windows audio release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deep-shift-full/build/windows
          godot --headless --path deep-shift-full --export-release "Windows Desktop" build/windows/DeepShift.exe 2>&1 | tee export-windows.log
          ! grep -E "SCRIPT ERROR|ERROR:" export-windows.log
          test -s deep-shift-full/build/windows/DeepShift.exe
          sha256sum deep-shift-full/build/windows/DeepShift.exe > deep-shift-full/build/windows/SHA256.txt
          if [ -f deep-shift-full/build/windows/DeepShift.pck ]; then sha256sum deep-shift-full/build/windows/DeepShift.pck >> deep-shift-full/build/windows/SHA256.txt; fi
          printf 'Blazed Trail Studios\nDeep Shift\nWindows Audio Release Candidate\nProcedural Audio: PASS\n' > deep-shift-full/build/windows/BUILD_IDENTITY.txt
          echo 'DEEP_SHIFT_WINDOWS_AUDIO_EXPORT_GATE: PASS'

      - name: Upload Windows audio release candidate
        uses: actions/upload-artifact@v4
        with:
          name: DeepShift-Windows-Audio-Release-Candidate
          path: deep-shift-full/build/windows/
          retention-days: 90
