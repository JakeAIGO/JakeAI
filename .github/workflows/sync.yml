name: JakeAI Drive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Latest Release
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=1i5ahg72wT840vrAX5JIyGo2wlPEGSlyx" -o release.zip
          unzip -o release.zip -d .
          rm release.zip

      - name: Commit and Push Changes
        run: |
          git config --global user.name "JakeAI Sync"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-sync from JakeAI Master Drive Build" || echo "No changes to commit"
          git push --force origin main

