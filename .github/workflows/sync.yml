name: JakeAI Drive Sync

on:
  workflow_dispatch:

jobs:
  sync-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Drive Sync Disabled
        run: |
          echo "Legacy Google Drive ZIP sync has been disabled."
          echo "GitHub is now the source of truth for JakeAI code."
          echo "Google Drive remains the source of truth for planning and master documents."
