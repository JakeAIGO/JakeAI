name: Rebuild JakeAI Portrait Binary
on:
  push:
    paths:
      - '.github/workflows/portrait-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct portrait asset
        shell: bash
        run: |
          set -euo pipefail
          cat assets/portrait/00.txt assets/portrait/01.txt assets/portrait/02.txt assets/portrait/03.txt assets/portrait/04.txt assets/portrait/05.txt assets/portrait/06.txt | tr -d '\r\n\t ' > /tmp/portrait.b64
          base64 -d /tmp/portrait.b64 > assets/jakeai-portrait.webp
          test -s assets/jakeai-portrait.webp
          file assets/jakeai-portrait.webp
      - name: Commit real binary portrait
        shell: bash
        run: |
          git config user.name 'JakeAI Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/jakeai-portrait.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Reconstruct JakeAI portrait as real binary asset'
          git push
