<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JakeAI: Signal Vault V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050811;color:#e9fbff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#193550 0,#09111f 35%,#050811 72%)}main{max-width:900px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}.logo{font-size:clamp(20px,5vw,32px);font-weight:1000;letter-spacing:.08em;text-shadow:0 0 18px #36e5ff}.logo b{color:#54e8ff}.tag{font-size:11px;color:#86a6bd;letter-spacing:.15em}.hud{display:flex;gap:12px;font-size:12px}.hud b{color:#ffe469}.cab{margin-top:9px;padding:7px;border:1px solid #25445c;border-radius:16px;background:linear-gradient(#101c2c,#070c15);box-shadow:inset 0 0 30px #07101d,0 0 25px #0b2634}canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:11px;background:#05070c;touch-action:none}.below{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 2px;color:#8aa4b8;font-size:11px}.btn{min-height:44px;border:1px solid #36536b;background:#111e31;color:#fff;border-radius:10px;padding:0 13px;font:700 13px inherit}.pad{width:270px;margin:8px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pad button{min-height:51px;border-radius:12px;border:1px solid #315169;background:linear-gradient(#153d50,#102c3c);color:#fff;font:900 17px inherit;box-shadow:inset 0 1px #39738b}.pad .fire{background:linear-gradient(#3d284c,#261a38);border-color:#745388;font-size:12px}.status{text-align:center;font-size:11px;letter-spacing:.1em;color:#66e9ff;min-height:16px}@media(min-width:700px){.pad{width:320px}}
</style></head><body><main id="game" tabindex="0">
<div class="head"><div><div class="logo">JAKE<b>AI</b> // SIGNAL VAULT <span style="font-size:.45em;color:#ffdf62">V2</span></div><div class="tag">AUTONOMOUS FACILITY RECOVERY UNIT</div></div><div class="hud"><span>SCORE <b id="score">000000</b></span><span>CORES <b id="cores">0/4</b></span><span>BOT <b id="lives">●●●</b></span></div></div>
<div class="cab"><canvas id="cv" width="960" height="600" aria-label="JakeAI Signal Vault V2 game"></canvas></div>
<div class="below"><span>Recover 4 cores · corrupted drones patrol each lab · PULSE disables drones</span><button class="btn" id="reset">REBOOT</button></div><div class="status" id="status">SECTOR 01 // FOUNDRY NIGHT SHIFT</div>
<div class="pad"><i></i><button data-k="ArrowUp">▲</button><i></i><button data-k="ArrowLeft">◀</button><button class="fire" data-k="Space">⚡ PULSE</button><button data-k="ArrowRight">▶</button><i></i><button data-k="ArrowDown">▼</button><i></i></div>
<script>
(()=>{const R=document.querySelector('#game'),C=document.querySelector('#cv'),g=C.getContext('2d'),S=document.querySelector('#score'),K=document.querySelector('#cores'),L=document.querySelector('#lives'),ST=document.querySelector('#status');let key={},last=0,shake=0,G;
const rooms=[{x:60,y:65,w:330,h:190,n:'EVIDENCE ARCHIVE',c:'#4eeaff',icon:'E'},{x:570,y:65,w:330,h:190,n:'WORKFLOW FOUNDRY',c:'#ffcf57',icon:'W'},{x:60,y:345,w:330,h:190,n:'CAPABILITY LAB',c:'#a875ff',icon:'C'},{x:570,y:345,w:330,h:190,n:'ENTITLEMENT VAULT',c:'#62f19b',icon:'K'}];
const rand=(a,b)=>a+Math.random()*(b-a);function init(){G={p:{x:480,y:300,r:13,dx:1,dy:0},score:0,lives:3,taken:[0,0,0,0],shots:[],parts:[],inv:0,won:0,t:0,en:rooms.map((r,i)=>({x:r.x+70+i*28,y:r.y+75,vx:(i%2?1:-1)*(55+i*8),vy:(i<2?1:-1)*(43+i*5),r:15,room:i,hp:2}))};sync()}
function sync(){S.textContent=String(G.score).padStart(6,'0');K.textContent=G.taken.filter(Boolean).length+'/4';L.textContent='●'.repeat(G.lives)+'○'.repeat(3-G.lives);ST.textContent=G.won?'SECTOR CLEAN // ALL SYSTEMS NOMINAL':'SECTOR 01 // FOUNDRY NIGHT SHIFT'}
const inside=(p,r)=>p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h;
function burst(x,y,col,n=16){for(let i=0;i<n;i++)G.parts.push({x,y,vx:rand(-150,150),vy:rand(-150,150),life:rand(.3,.8),c:col,s:rand(2,5)})}
function fire(){if(G.won)return;G.shots.push({x:G.p.x+G.p.dx*15,y:G.p.y+G.p.dy*15,vx:G.p.dx*410,vy:G.p.dy*410,life:.8});burst(G.p.x,G.p.y,'#71f5ff',5)}
function hurt(){if(G.inv||G.won)return;G.lives--;G.inv=1.3;shake=10;burst(G.p.x,G.p.y,'#ff5367',25);G.p.x=480;G.p.y=300;if(G.lives<=0){init();ST.textContent='UNIT REBUILT // TRY AGAIN'}sync()}
function update(dt){G.t+=dt;if(G.won){particles(dt);return}G.inv=Math.max(0,G.inv-dt);let dx=(key.ArrowRight||key.d?1:0)-(key.ArrowLeft||key.a?1:0),dy=(key.ArrowDown||key.s?1:0)-(key.ArrowUp||key.w?1:0);if(dx||dy){let q=Math.hypot(dx,dy);dx/=q;dy/=q;G.p.dx=dx;G.p.dy=dy;G.p.x=Math.max(20,Math.min(940,G.p.x+dx*190*dt));G.p.y=Math.max(20,Math.min(580,G.p.y+dy*190*dt))}
rooms.forEach((r,i)=>{if(!G.taken[i]&&inside(G.p,r)){let cx=r.x+r.w/2,cy=r.y+r.h/2;if(Math.hypot(G.p.x-cx,G.p.y-cy)<29){G.taken[i]=1;G.score+=500;shake=7;burst(cx,cy,r.c,34);if(G.taken.every(Boolean)){G.won=1;G.score+=2500;for(let j=0;j<90;j++)burst(rand(120,840),rand(100,500),rooms[j%4].c,1)}sync()}}});
G.en.forEach(e=>{let r=rooms[e.room];e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<r.x+22||e.x>r.x+r.w-22)e.vx*=-1;if(e.y<r.y+42||e.y>r.y+r.h-22)e.vy*=-1;if(Math.hypot(e.x-G.p.x,e.y-G.p.y)<e.r+G.p.r)hurt()});
G.shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});for(let si=G.shots.length-1;si>=0;si--){let s=G.shots[si],gone=s.life<=0;for(let ei=G.en.length-1;ei>=0&&!gone;ei--){let e=G.en[ei];if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+7){e.hp--;burst(e.x,e.y,'#ff5367',12);shake=4;if(e.hp<=0){G.score+=150;G.en.splice(ei,1);burst(e.x,e.y,'#ffb24f',25)}gone=1;sync()}}if(gone)G.shots.splice(si,1)}particles(dt)}
function particles(dt){G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});G.parts=G.parts.filter(p=>p.life>0)}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function drawRoom(r,i){g.fillStyle='#0b1522';rr(r.x,r.y,r.w,r.h,12);g.fill();g.strokeStyle=G.taken[i]?'#27394b':r.c;g.lineWidth=3;g.stroke();g.save();g.globalAlpha=.16;g.strokeStyle=r.c;for(let y=r.y+48;y<r.y+r.h;y+=24){g.beginPath();g.moveTo(r.x+8,y);g.lineTo(r.x+r.w-8,y);g.stroke()}for(let x0=r.x+22;x0<r.x+r.w;x0+=42){g.beginPath();g.moveTo(x0,r.y+38);g.lineTo(x0,r.y+r.h-8);g.stroke()}g.restore();g.fillStyle=r.c;g.font='bold 14px monospace';g.fillText(r.n,r.x+14,r.y+25);
for(let j=0;j<3;j++){let bx=r.x+25+j*88;g.fillStyle='#14283a';g.fillRect(bx,r.y+r.h-38,58,20);g.fillStyle=r.c;g.globalAlpha=.45+.25*Math.sin(G.t*3+j);g.fillRect(bx+7,r.y+r.h-31,44,5);g.globalAlpha=1}
if(!G.taken[i]){let cx=r.x+r.w/2,cy=r.y+r.h/2,p=4+Math.sin(G.t*5)*3;g.save();g.shadowBlur=22;g.shadowColor=r.c;g.fillStyle=r.c;g.beginPath();for(let a=0;a<8;a++){let ang=Math.PI/4*a,rad=a%2?18:27;let xx=cx+Math.cos(ang)*rad,yy=cy+Math.sin(ang)*rad;a?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#071018';g.font='bold 20px monospace';g.textAlign='center';g.fillText(r.icon,cx,cy+7);g.textAlign='left';g.strokeStyle=r.c;g.globalAlpha=.35;g.beginPath();g.arc(cx,cy,36+p,0,7);g.stroke();g.restore()}}
function drone(e){g.save();g.translate(e.x,e.y);g.shadowBlur=14;g.shadowColor='#ff3d55';g.fillStyle='#3a1823';g.beginPath();g.moveTo(-18,-8);g.lineTo(-7,-15);g.lineTo(9,-12);g.lineTo(18,0);g.lineTo(8,12);g.lineTo(-10,13);g.closePath();g.fill();g.strokeStyle='#ff5367';g.lineWidth=2;g.stroke();g.fillStyle='#ff5367';g.fillRect(-6,-3,12,6);g.strokeStyle='#d7f5ff';g.beginPath();g.moveTo(-24,-13);g.lineTo(-15,-7);g.moveTo(24,-13);g.lineTo(15,-7);g.stroke();g.restore()}
function bot(){let p=G.p;if(G.inv&&Math.floor(G.inv*14)%2)return;g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.dy,p.dx));g.shadowBlur=17;g.shadowColor='#55eaff';g.fillStyle='#173b4b';g.fillRect(-11,-10,22,20);g.strokeStyle='#61edff';g.lineWidth=2;g.strokeRect(-11,-10,22,20);g.fillStyle='#65efff';g.fillRect(5,-5,8,10);g.fillStyle='#ffe469';g.fillRect(-5,-4,4,4);g.fillRect(-5,3,4,4);g.strokeStyle='#65efff';g.beginPath();g.moveTo(-7,-12);g.lineTo(-11,-18);g.moveTo(-7,12);g.lineTo(-11,18);g.stroke();g.restore()}
function draw(){let sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;shake*=.84;if(shake<.2)shake=0;g.setTransform(1,0,0,1,sx,sy);g.fillStyle='#050911';g.fillRect(-20,-20,1000,640);let grd=g.createRadialGradient(480,300,20,480,300,520);grd.addColorStop(0,'#12233a');grd.addColorStop(1,'#050911');g.fillStyle=grd;g.fillRect(0,0,960,600);
g.strokeStyle='#14263a';g.lineWidth=1;for(let x0=0;x0<960;x0+=32){g.beginPath();g.moveTo(x0,0);g.lineTo(x0,600);g.stroke()}for(let y=0;y<600;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke()}
g.strokeStyle='#2b5369';g.lineWidth=14;g.beginPath();g.moveTo(390,160);g.lineTo(570,160);g.moveTo(390,440);g.lineTo(570,440);g.moveTo(480,255);g.lineTo(480,345);g.stroke();g.strokeStyle='#63eaff';g.lineWidth=2;g.setLineDash([12,12]);g.lineDashOffset=-G.t*45;g.stroke();g.setLineDash([]);
rooms.forEach(drawRoom);G.en.forEach(drone);G.shots.forEach(s=>{g.save();g.shadowBlur=14;g.shadowColor='#fff071';g.fillStyle='#fff071';g.beginPath();g.arc(s.x,s.y,6,0,7);g.fill();g.restore()});G.parts.forEach(p=>{g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s);g.globalAlpha=1});bot();
g.fillStyle='#9bb4c7';g.font='11px monospace';g.fillText('JAKEAI FOUNDRY // NIGHT SHIFT',18,22);g.fillStyle='#365269';g.fillText('AUTONOMOUS SYSTEMS ONLINE',760,22);
if(G.won){g.fillStyle='rgba(3,7,13,.86)';rr(250,230,460,130,14);g.fill();g.strokeStyle='#63efff';g.lineWidth=3;g.stroke();g.shadowBlur=18;g.shadowColor='#63efff';g.fillStyle='#eaffff';g.font='bold 34px monospace';g.textAlign='center';g.fillText('SIGNAL RESTORED',480,280);g.shadowBlur=0;g.fillStyle='#ffe469';g.font='15px monospace';g.fillText('FOUNDRY SECTOR 01 CLEARED',480,316);g.fillStyle='#8fb4c8';g.font='12px monospace';g.fillText('THE FACTORY LEARNS. THE NEXT VAULT OPENS.',480,340);g.textAlign='left'}g.setTransform(1,0,0,1,0,0)}
function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function down(k){key[k]=1;if(k==='Space')fire()}function up(k){key[k]=0}R.addEventListener('keydown',e=>{let k=e.key===' '?'Space':e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','w','a','s','d'].includes(k)){e.preventDefault();down(k)}});R.addEventListener('keyup',e=>up(e.key===' '?'Space':e.key));document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();R.focus();down(k)});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>up(k)))});document.querySelector('#reset').onclick=()=>{init();R.focus()};init();R.focus();requestAnimationFrame(loop)})();
</script></main></body></html>
