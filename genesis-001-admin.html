<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JakeAI Genesis #001 Operator</title><style>*{box-sizing:border-box}body{margin:0;background:#020508;color:#eefaff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(980px,94vw);margin:auto;padding:26px 0 60px}h1{margin:0 0 8px}.sub{color:#9eb8c5}.panel{margin-top:18px;padding:20px;border:1px solid #284c5e;border-radius:18px;background:#071019}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:12px;border:1px solid #173747;border-radius:12px;background:#03090d}.field b{display:block;color:#72eaff;font-size:11px;letter-spacing:.1em;margin-bottom:5px}.field pre{white-space:pre-wrap;margin:0;font:inherit;color:#dbeaf0}.auth{display:flex;gap:8px}.auth input,textarea{width:100%;padding:11px;border:1px solid #315264;border-radius:10px;background:#02070a;color:#fff;font:inherit}.auth button,.actions button{padding:11px 14px;border:1px solid #6eeaff;border-radius:10px;background:#0b3444;color:#fff;font-weight:900;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{border-color:#ff9f9f!important;background:#451c24!important}.ok{color:#8fffc0}.warn{color:#ffd27a}.events{margin-top:12px}.event{padding:10px 0;border-top:1px solid #16313e;font-size:13px;color:#b7ccd5}.event b{color:#e9fbff}@media(max-width:720px){.grid{grid-template-columns:1fr}.auth{display:grid}}</style></head><body><div class="wrap"><h1>Genesis #001 Operator</h1><div class="sub">Private operator surface. Token is kept only in this browser session and is sent as a Bearer header.</div><section class="panel"><div class="auth"><input id="token" type="password" autocomplete="off" placeholder="GENESIS_ADMIN_TOKEN"><button id="load">LOAD #001</button></div><div id="status" class="sub" style="margin-top:10px">Not connected.</div></section><section class="panel" id="commission" hidden><div class="grid" id="fields"></div><label style="display:block;margin-top:14px;font-size:12px;font-weight:900;color:#bfc7ff">OPERATOR NOTE<textarea id="note" rows="3"></textarea></label><label style="display:block;margin-top:10px;font-size:12px;font-weight:900;color:#bfc7ff">DELIVERY NOTE<textarea id="delivery" rows="3"></textarea></label><div class="actions"><button id="accept">ACCEPT</button><button id="complete">COMPLETE</button><button id="decline" class="danger">DECLINE</button><button id="release" class="danger">VERIFY REFUND & RELEASE</button></div><div id="actionStatus" class="sub" style="margin-top:10px"></div></section><section class="panel" id="eventsPanel" hidden><h2>Audit events</h2><div id="events" class="events"></div></section></div><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const token=()=>sessionStorage.getItem('jakeai-genesis-admin')||$('token').value.trim();async function api(path,opts={}){const t=token();if(!t)throw new Error('Enter the Genesis admin token.');sessionStorage.setItem('jakeai-genesis-admin',t);$('token').value='';const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+t,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d?.error?.message||d?.detail||'Request failed');return d}function render(d){const c=d.commission||{};$('commission').hidden=false;$('eventsPanel').hidden=false;$('status').innerHTML='<span class="ok">Connected · state: '+esc(c.state||'unknown')+'</span>';const rows=[['State',c.state],['Customer',c.customer_email],['Problem',c.problem],['Desired outcome',c.desired_outcome],['Current approach',c.current_approach],['Customer notes',c.notes],['Intake received',c.intake_received_at],['Accepted',c.accepted_at],['Declined',c.declined_at],['Completed',c.completed_at],['Updated',c.updated_at]];$('fields').innerHTML=rows.map(x=>'<div class="field"><b>'+esc(x[0])+'</b><pre>'+esc(x[1]||'—')+'</pre></div>').join('');$('note').value=c.operator_note||'';$('delivery').value=c.delivery_note||'';$('events').innerHTML=(d.events||[]).map(e=>'<div class="event"><b>'+esc(e.event_type)+'</b> · '+esc(e.state_from||'—')+' → '+esc(e.state_to||'—')+' · '+esc(e.created_at||'')+'<br>'+esc(e.note||'')+'</div>').join('')||'<div class="sub">No events yet.</div>'}async function load(){try{$('status').textContent='Loading…';render(await api('/v1/genesis/001/admin/status'))}catch(e){$('status').innerHTML='<span class="warn">'+esc(e.message)+'</span>'}}async function action(name){try{$('actionStatus').textContent='Working…';const d=await api('/v1/genesis/001/admin/'+name,{method:'POST',body:JSON.stringify({note:$('note').value,delivery_note:$('delivery').value})});$('actionStatus').innerHTML='<span class="ok">'+esc(d.message||('State: '+d.state))+'</span>';await load()}catch(e){$('actionStatus').innerHTML='<span class="warn">'+esc(e.message)+'</span>'}}$('load').onclick=load;$('accept').onclick=()=>action('accept');$('complete').onclick=()=>action('complete');$('decline').onclick=()=>{if(confirm('Decline Genesis #001? The slot will remain locked until a full refund is verified.'))action('decline')};$('release').onclick=()=>{if(confirm('Verify that Stripe shows a successful full $49 refund, then release #001?'))action('refund-release')};if(sessionStorage.getItem('jakeai-genesis-admin'))load();</script></body></html>
