[build]
  publish = "."
  command = "cat assets/portrait/00.txt assets/portrait/01.txt assets/portrait/02.txt assets/portrait/03.txt assets/portrait/04.txt assets/portrait/05.txt assets/portrait/06.txt | tr -d '\\r\\n\\t ' | base64 -d > assets/jakeai-portrait.webp && test -s assets/jakeai-portrait.webp"

[[redirects]]
  from = "/v1/*"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/checkout"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/health/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/llms.txt"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "https://agent-commerce-network-production-56e8.up.railway.app/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
