[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/v1/tools/context-reacquisition-auditor"
  to = "/.netlify/functions/context-reacquisition-auditor"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/tools/context-reacquisition-auditor"
  to = "/.netlify/functions/context-reacquisition-auditor"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://agent-commerce-network-production.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "https://agent-commerce-network-production.up.railway.app/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://agent-commerce-network-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://agent-commerce-network-production.up.railway.app/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://agent-commerce-network-production.up.railway.app/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://agent-commerce-network-production.up.railway.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/checkout"
  to = "https://agent-commerce-network-production.up.railway.app/health/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "https://agent-commerce-network-production.up.railway.app/llms.txt"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "https://agent-commerce-network-production.up.railway.app/.well-known/:splat"
  status = 200
  force = true

# KJAI radio must resolve to the static Broadcast 002 player before the SPA fallback.
[[redirects]]
  from = "/radio"
  to = "/radio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/radio/"
  to = "/radio/index.html"
  status = 200
  force = true

# Product pages must resolve before the SPA fallback.
[[redirects]]
  from = "/universe-final/agent-mandate-verifier"
  to = "/universe-final/agent-mandate-verifier.html"
  status = 200
  force = true

[[redirects]]
  from = "/universe-final/agent-mandate-verifier.html"
  to = "/universe-final/agent-mandate-verifier.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
